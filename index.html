<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nh?c Xe YouTube — Nghe Nh?c Gi?ng YouTube</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Roboto, Arial, sans-serif; }
:root {
  --bg: #0f0f0f; --surface: #212121; --hover: #303030;
  --accent: #ff0000; --text: #fff; --text-sec: #aaa;
  --player: #181818;
}
body { background:var(--bg); color:var(--text); padding-bottom:100px; }

/* ===== Header ===== */
header {
  position:fixed; top:0; left:0; right:0; height:56px; background:var(--bg);
  display:flex; align-items:center; padding:0 16px; gap:16px; z-index:100; border-bottom:1px solid #2f2f2f;
}
.logo { display:flex; align-items:center; gap:4px; font-size:20px; font-weight:600; color:var(--text); text-decoration:none; }
.logo span { color:var(--accent); font-size:24px; }
.search-bar { flex:1; display:flex; max-width:640px; margin:0 auto; }
.search-bar input {
  flex:1; height:40px; background:var(--surface); border:1px solid #444; border-radius:20px 0 0 20px;
  padding:0 16px; font-size:16px; color:var(--text); outline:none;
}
.search-bar button {
  width:64px; height:40px; background:#313131; border:none; border-radius:0 20px 20px 0;
  color:var(--text); cursor:pointer; font-size:18px;
}
.search-bar button:hover { background:#444; }

/* ===== N?i dung ===== */
main { margin-top:56px; padding:20px; }
.hero {
  background:linear-gradient(rgba(0,0,0,.7), rgba(0,0,0,.8)), url('https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=1200');
  background-size:cover; background-position:center; padding:30px 20px; border-radius:12px; margin-bottom:20px;
}
.hero h1 { font-size:24px; margin-bottom:8px; }
.hero p { color:#ccc; max-width:600px; }
.section-title { font-size:20px; margin:24px 0 12px; font-weight:600; }
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:16px; }
.card { cursor:pointer; border-radius:12px; overflow:hidden; transition:transform .2s; background:var(--surface); }
.card:hover { transform:scale(1.03); }
.card-thumb { width:100%; aspect-ratio:16/9; background:#444; overflow:hidden; position:relative; }
.card-thumb img { width:100%; height:100%; object-fit:cover; }
.card-thumb .play-icon {
  position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
  font-size:40px; opacity:.8; text-shadow:0 2px 8px #000;
}
.card-info { padding:10px; }
.card-title { font-weight:600; font-size:15px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card-artist { font-size:13px; color:var(--text-sec); margin-top:4px; }

/* ===== Trình phát YouTube ?n ===== */
#playerContainer { position:fixed; left:-9999px; top:0; opacity:0; pointer-events:none; }

/* ===== Thanh phát du?i ===== */
.player-bar {
  position:fixed; bottom:0; left:0; right:0; height:95px; background:var(--player);
  border-top:1px solid #333; display:flex; align-items:center; padding:0 16px; gap:16px; z-index:100;
}
.player-thumb { width:56px; height:56px; border-radius:6px; overflow:hidden; flex-shrink:0; }
.player-thumb img { width:100%; height:100%; object-fit:cover; }
.player-info { flex:1; min-width:0; }
.player-title { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.player-artist { font-size:12px; color:var(--text-sec); }
.player-controls { display:flex; align-items:center; gap:10px; flex-shrink:0; }
.player-controls button {
  width:44px; height:44px; border-radius:50%; border:none; background:transparent; color:white;
  font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.player-controls button:hover { background:rgba(255,255,255,.1); }
.play-btn { background:var(--accent) !important; }
.play-btn:hover { background:#cc0000 !important; }
.progress-wrap { position:absolute; top:0; left:0; right:0; height:4px; background:#333; cursor:pointer; }
.progress-bar { height:100%; background:var(--accent); width:0%; transition:width .1s linear; }
.time-info { font-size:11px; color:var(--text-sec); margin-left:4px; min-width:70px; }
.hidden { display:none !important; }
.loading { text-align:center; padding:20px; color:#888; }
@media (max-width: 600px) {
  .grid { grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); }
  header { padding:0 8px; }
}
</style>
<!-- T?i SDK YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>

<header>
  <a href="#" class="logo"><span>?</span> Nh?c Xe</a>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Tìm bài hát, ca si trên YouTube...">
    <button id="searchBtn">??</button>
  </div>
</header>

<main>
  <div class="hero">
    <h1>?? Nghe Nh?c YouTube — Ch?y N?n Khi Lái Xe</h1>
    <p>Tìm ki?m tr?c ti?p trên YouTube, phát liên t?c, t? d?ng chuy?n bài, ti?p t?c nghe khi m? ?ng d?ng khác.</p>
  </div>

  <div id="searchSection" class="hidden">
    <h2 class="section-title">K?t qu? tìm ki?m</h2>
    <div id="searchGrid" class="grid"></div>
  </div>

  <h2 class="section-title">?? G?i ý th?nh hành</h2>
  <div id="recommendGrid" class="grid">
    <div class="loading">Ðang t?i g?i ý...</div>
  </div>
</main>

<!-- Trình phát YouTube ?n -->
<div id="playerContainer">
  <div id="ytPlayer"></div>
</div>

<!-- Thanh di?u khi?n du?i -->
<div class="player-bar">
  <div class="progress-wrap" id="progressWrap">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <div class="player-thumb" id="playerThumb">??</div>
  <div class="player-info">
    <div class="player-title" id="playerTitle">Ch?n bài hát d? phát</div>
    <div class="player-artist" id="playerArtist">YouTube Music</div>
  </div>
  <div class="player-controls">
    <button id="prevBtn">?</button>
    <button id="playBtn" class="play-btn">?</button>
    <button id="nextBtn">?</button>
    <span class="time-info" id="timeText">0:00 / 0:00</span>
  </div>
</div>

<script>
// ===== C?u hình =====
// L?y API key mi?n phí t?i: https://console.cloud.google.com/ ? YouTube Data API v3
const YOUTUBE_API_KEY = 'AIzaSyCPZf8Kws-Czw-6AIoZebDO_XTeCSZ2ni0'; // ? Thay b?ng khóa c?a b?n
let player = null;
let playlist = [];
let currentIndex = -1;
let isPlaying = false;
let totalDuration = 0;
let progressTimer = null;

// ===== Các ph?n t? =====
const searchInput = document.getElementById('searchInput');
const searchBtn = document.getElementById('searchBtn');
const searchSection = document.getElementById('searchSection');
const searchGrid = document.getElementById('searchGrid');
const recommendGrid = document.getElementById('recommendGrid');
const playerTitle = document.getElementById('playerTitle');
const playerArtist = document.getElementById('playerArtist');
const playerThumb = document.getElementById('playerThumb');
const playBtn = document.getElementById('playBtn');
const nextBtn = document.getElementById('nextBtn');
const prevBtn = document.getElementById('prevBtn');
const progressBar = document.getElementById('progressBar');
const progressWrap = document.getElementById('progressWrap');
const timeText = document.getElementById('timeText');

// ===== Kh?i t?o YouTube Player =====
window.onYouTubeIframeAPIReady = function() {
  player = new YT.Player('ytPlayer', {
    height: '180',
    width: '320',
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      enablejsapi: 1,
      origin: window.location.origin,
      playsinline: 1
    },
    events: {
      onReady: onPlayerReady,
      onStateChange: onPlayerStateChange
    }
  });
};

function onPlayerReady() {
  console.log('Trình phát YouTube dã s?n sàng ?');
  loadRecommendations();
}

function onPlayerStateChange(event) {
  switch(event.data) {
    case YT.PlayerState.PLAYING:
      isPlaying = true;
      playBtn.textContent = '?';
      startProgressUpdater();
      break;
    case YT.PlayerState.PAUSED:
      isPlaying = false;
      playBtn.textContent = '?';
      stopProgressUpdater();
      break;
    case YT.PlayerState.ENDED:
      playNext();
      break;
    case YT.PlayerState.BUFFERING:
      // Ðang t?i
      break;
  }
}

// ===== Tìm ki?m trên YouTube =====
async function searchYouTube(query, maxResults = 12) {
  try {
    const res = await fetch(`https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(query)}&type=video&videoCategoryId=10&maxResults=${maxResults}&key=${YOUTUBE_API_KEY}`);
    const data = await res.json();
    if (!data.items) return [];
    
    return data.items.map(item => ({
      id: item.id.videoId,
      title: item.snippet.title.replace(/&quot;/g,'"').replace(/&#39;/g,"'"),
      channelTitle: item.snippet.channelTitle,
      thumb: item.snippet.thumbnails.medium.url
    }));
  } catch (err) {
    console.error('L?i tìm ki?m:', err);
    return [];
  }
}

// ===== T?i g?i ý =====
async function loadRecommendations() {
  recommendGrid.innerHTML = '<div class="loading">Ðang t?i g?i ý...</div>';
  // Tìm nh?c th?nh hành Vi?t Nam làm g?i ý m?c d?nh
  const results = await searchYouTube('nh?c tr? Vi?t Nam hot nh?t', 8);
  if (results.length === 0) {
    recommendGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#f66;">Vui lòng c?u hình API Key YouTube tru?c ?</p>';
    return;
  }
  renderList(recommendGrid, results);
}

// ===== Hi?n th? danh sách =====
function renderList(container, items) {
  container.innerHTML = '';
  items.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-thumb">
        <img src="${item.thumb}" alt="${item.title}" loading="lazy">
        <span class="play-icon">?</span>
      </div>
      <div class="card-info">
        <div class="card-title">${item.title}</div>
        <div class="card-artist">${item.channelTitle}</div>
      </div>
    `;
    card.onclick = () => playVideo(item, items);
    container.appendChild(card);
  });
}

// ===== Phát video =====
function playVideo(videoItem, list) {
  playlist = list;
  currentIndex = playlist.findIndex(v => v.id === videoItem.id);
  
  // C?p nh?t giao di?n
  playerTitle.textContent = videoItem.title;
  playerArtist.textContent = videoItem.channelTitle;
  playerThumb.innerHTML = `<img src="${videoItem.thumb}" alt="">`;
  
  // T?i & phát trên YouTube Player
  if (player && player.loadVideoById) {
    player.loadVideoById(videoItem.id);
  }
  
  searchSection.classList.add('hidden');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ===== Ði?u khi?n =====
function togglePlay() {
  if (!player) return;
  if (currentIndex === -1 && playlist.length > 0) {
    playVideo(playlist[0], playlist);
    return;
  }
  if (isPlaying) player.pauseVideo();
  else player.playVideo();
}

function playNext() {
  if (!playlist.length) return;
  currentIndex = (currentIndex + 1) % playlist.length;
  playVideo(playlist[currentIndex], playlist);
}

function playPrev() {
  if (!playlist.length) return;
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playVideo(playlist[currentIndex], playlist);
}

// ===== Thanh ti?n trình =====
function formatTime(sec) {
  if (isNaN(sec) || sec === 0) return '0:00';
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
}

function startProgressUpdater() {
  stopProgressUpdater();
  progressTimer = setInterval(() => {
    if (!player || !player.getCurrentTime) return;
    const current = player.getCurrentTime() || 0;
    totalDuration = player.getDuration() || 0;
    const pct = totalDuration > 0 ? (current / totalDuration) * 100 : 0;
    progressBar.style.width = pct + '%';
    timeText.textContent = `${formatTime(current)} / ${formatTime(totalDuration)}`;
  }, 500);
}

function stopProgressUpdater() {
  if (progressTimer) {
    clearInterval(progressTimer);
    progressTimer = null;
  }
}

// ===== Nh?y v? trí =====
progressWrap.onclick = (e) => {
  if (!player || !totalDuration) return;
  const rect = progressWrap.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if (player.seekTo) player.seekTo(pct * totalDuration, true);
};

// ===== Tìm ki?m =====
async function doSearch() {
  const q = searchInput.value.trim();
  if (!q) {
    searchSection.classList.add('hidden');
    return;
  }
  searchGrid.innerHTML = '<div class="loading">Ðang tìm...</div>';
  searchSection.classList.remove('hidden');
  
  const results = await searchYouTube(q);
  if (results.length === 0) {
    searchGrid.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:#888;">Không tìm th?y bài hát phù h?p</p>';
    return;
  }
  renderList(searchGrid, results);
}

// ===== Gi? phát n?n =====
document.addEventListener('visibilitychange', () => {
  if (isPlaying && player && player.playVideo) {
    setTimeout(() => {
      if (player.getPlayerState() !== YT.PlayerState.PLAYING) {
        player.playVideo();
      }
    }, 100);
  }
});

// ===== G?n s? ki?n =====
playBtn.onclick = togglePlay;
nextBtn.onclick = playNext;
prevBtn.onclick = playPrev;
searchBtn.onclick = doSearch;
searchInput.onkeydown = e => e.key === 'Enter' && doSearch();
</script>
</body>
</html>
