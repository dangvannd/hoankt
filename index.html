<script>
    // ==================== CẤU HÌNH ====================
    // ⚠️ Điền khóa API YouTube của bạn vào dòng bên dưới
    const YOUTUBE_API_KEY = "AIzaSyCFDlmrjK9jeprzZLa3yJzxsLi1zYBNMWI";
    const API_SEARCH = "https://www.googleapis.com/youtube/v3/search";
    // ==================== DANH SÁCH GỢI Ý MẶC ĐỊNH ====================
    const SUGGESTED_KEYWORDS = [
        "nhạc vàng bolero hay nhất",
        "liên khúc bolero trữ tình",
        "nhạc vàng xưa chọn lọc",
        "nhạc nhẹ êm dịu thư giãn",
        "nhạc trữ tình không lời"
    ];
    // ==================== TRẠNG THÁI ====================
    let player = null;
    let isAPILoaded = false;
    let isPlayerReady = false;
    let playlist = [];
    let favorites = JSON.parse(localStorage.getItem('favMusic') || '[]');
    let currentIdx = -1;
    let isShuffle = false;
    let repeatMode = 0;
    let isPlaying = false;
    let suggestedList = [];
    let pendingVideoId = null;
    let sidebarCollapsed = false;
    let timeUpdateInterval = null;
    let playerReadyTimeout = null;
    // ==================== PHẦN TỬ ====================
    const el = {
        searchInput: document.getElementById('searchInput'),
        searchBtn: document.getElementById('searchBtn'),
        pageTitle: document.getElementById('pageTitle'),
        videoGrid: document.getElementById('videoGrid'),
        loadingOverlay: document.getElementById('loadingOverlay'),
        sidebar: document.getElementById('sidebar'),
        sidebarOverlay: document.getElementById('sidebarOverlay'),
        sidebarToggle: document.getElementById('sidebarToggle'),
        logoLink: document.getElementById('logoLink'),
        homeLink: document.getElementById('homeLink'),
        favPageLink: document.getElementById('favPageLink'),
        favBtn: document.getElementById('favBtn'),
        homePage: document.getElementById('homePage'),
        watchPage: document.getElementById('watchPage'),
        playerLoading: document.getElementById('playerLoading'),
        youtubePlayer: document.getElementById('youtube-player'),
        watchTitle: document.getElementById('watchTitle'),
        watchChannel: document.getElementById('watchChannel'),
        watchProgress: document.getElementById('watchProgress'),
        watchCurrent: document.getElementById('watchCurrent'),
        watchTotal: document.getElementById('watchTotal'),
        watchPlayPause: document.getElementById('watchPlayPause'),
        watchPrev: document.getElementById('watchPrev'),
        watchNext: document.getElementById('watchNext'),
        watchShuffle: document.getElementById('watchShuffle'),
        watchRepeat: document.getElementById('watchRepeat'),
        watchLike: document.getElementById('watchLike'),
        suggestedList: document.getElementById('suggestedList')
    };

    // Ẩn trạng thái tải an toàn
    function hidePlayerLoading() {
        if (el.playerLoading) {
            el.playerLoading.classList.add('hidden');
        }
        if (playerReadyTimeout) {
            clearTimeout(playerReadyTimeout);
            playerReadyTimeout = null;
        }
    }

    // Hiển thị trạng thái tải
    function showPlayerLoading() {
        if (el.playerLoading) {
            el.playerLoading.classList.remove('hidden');
        }
    }

    // ==================== MENU THAN BÊN - THU HẸP/MỞ RỘNG ====================
    function toggleSidebar() {
        sidebarCollapsed = !sidebarCollapsed;
        if (sidebarCollapsed) {
            el.sidebar.classList.remove('sm:w-sidebar-wide');
            el.sidebar.classList.add('w-sidebar-narrow');
            el.sidebarOverlay.classList.add('hidden');
        } else {
            el.sidebar.classList.remove('w-sidebar-narrow');
            el.sidebar.classList.add('sm:w-sidebar-wide');
        }
    }
    el.sidebarToggle.addEventListener('click', toggleSidebar);

    // ==================== TẢI API YOUTUBE ====================
    function loadAPI() {
        const s = document.createElement('script');
        s.src = "https://www.youtube.com/iframe_api";
        s.async = true;
        document.head.appendChild(s);
        
        // Hết thời gian chờ API
        setTimeout(() => {
            if (!isAPILoaded) {
                console.warn("Không tải được YouTube API");
                hidePlayerLoading();
            }
        }, 15000);
    }

    window.onYouTubeIframeAPIReady = function() {
        isAPILoaded = true;
        initPlayer();
    };

    function initPlayer() {
        if (!window.YT || !window.YT.Player) {
            setTimeout(initPlayer, 200);
            return;
        }
        
        // Đặt thời gian chờ tối đa cho trình phát
        playerReadyTimeout = setTimeout(() => {
            if (!isPlayerReady) {
                console.warn("Trình phát không sẵn sàng sau thời gian chờ");
                hidePlayerLoading();
            }
        }, 15000);

        player = new YT.Player('youtube-player', {
            height: '100%',
            width: '100%',
            playerVars: { 
                autoplay: 0,
                controls: 1,
                enablejsapi: 1,
                origin: window.location.origin,
                rel: 0,
                modestbranding: 1,
                playsinline: 1
            },
            events: {
                onReady: onPlayerReady,
                onStateChange: onStateChange,
                onError: onPlayerError
            }
        });
    }

    function onPlayerReady(e) {
        isPlayerReady = true;
        e.target.setVolume(75);
        // ✅ Ẩn loading ngay khi trình phát sẵn sàng
        hidePlayerLoading();
        
        if (pendingVideoId) {
            actuallyPlayVideo(pendingVideoId);
            pendingVideoId = null;
        }
    }

    function onStateChange(e) {
        switch (e.data) {
            case YT.PlayerState.PLAYING:
                isPlaying = true;
                hidePlayerLoading();
                updatePlayButton();
                startTimeUpdate();
                break;
            case YT.PlayerState.PAUSED:
                isPlaying = false;
                updatePlayButton();
                stopTimeUpdate();
                break;
            case YT.PlayerState.ENDED:
                stopTimeUpdate();
                repeatMode === 2 ? player.seekTo(0) : playNext();
                break;
            case YT.PlayerState.BUFFERING:
                showPlayerLoading();
                break;
            case YT.PlayerState.CUED:
                // ✅ Đã nạp xong nhưng chưa phát → ẩn loading
                hidePlayerLoading();
                break;
        }
    }

    function onPlayerError(e) {
        console.error('Lỗi trình phát:', e.data);
        hidePlayerLoading();
        // Tự động chuyển bài sau 3 giây nếu lỗi
        setTimeout(() => {
            if (playlist.length > 0) playNext();
        }, 3000);
    }

    // Cập nhật thời gian phát
    function startTimeUpdate() {
        stopTimeUpdate();
        timeUpdateInterval = setInterval(() => {
            if (!isPlayerReady || !player || !player.getDuration) return;
            const t = player.getCurrentTime();
            const d = player.getDuration();
            if (d && !isNaN(d)) {
                el.watchProgress.value = (t / d) * 100;
                el.watchCurrent.textContent = fmtTime(t);
                el.watchTotal.textContent = fmtTime(d);
            }
        }, 500);
    }

    function stopTimeUpdate() {
        if (timeUpdateInterval) {
            clearInterval(timeUpdateInterval);
            timeUpdateInterval = null;
        }
    }

    // ==================== TÌM KIẾM BÀI HÁT ====================
    async function searchDirect(q, isSuggestion = false) {
        if (!q || !q.trim()) return [];
        if (!isSuggestion) el.loadingOverlay.classList.remove('hidden');
        
        try {
            const res = await fetch(`${API_SEARCH}?part=snippet&q=${encodeURIComponent(q)}&type=video&videoCategoryId=10&maxResults=12&key=${YOUTUBE_API_KEY}`);
            
            if (!res.ok) {
                // Xử lý lỗi API cụ thể
                if (res.status === 403) throw new Error("Khóa API bị từ chối/hết hạn");
                if (res.status === 400) throw new Error("Khóa API không hợp lệ");
                throw new Error(`Lỗi kết nối: ${res.status}`);
            }
            
            const data = await res.json();
            if (!data.items) return [];
            
            const results = data.items.map(item => ({
                id: item.id.videoId,
                title: item.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                channel: item.snippet.channelTitle,
                thumb: item.snippet.thumbnails?.high?.url || item.snippet.thumbnails?.default?.url
            }));
            
            if (!isSuggestion) {
                el.pageTitle.textContent = `Kết quả cho "${q}"`;
                renderHomePage(results);
                showPage('home');
            }
            return results;
        } catch (err) {
            console.error('Lỗi tìm kiếm:', err);
            if (!isSuggestion) {
                alert(`Không tìm thấy: ${err.message}\nKiểm tra khóa API tại Google Cloud Console`);
            }
            return [];
        } finally {
            if (!isSuggestion) el.loadingOverlay.classList.add('hidden');
        }
    }

    function search(q) {
        if (!q || q.trim() === '') return;
        searchDirect(q, false);
    }

    // Tải gợi ý trang chủ
    async function loadSuggestions() {
        const randomKeyword = SUGGESTED_KEYWORDS[Math.floor(Math.random() * SUGGESTED_KEYWORDS.length)];
        const results = await searchDirect(randomKeyword, true);
        
        if (results.length) {
            renderHomePage(results);
        } else {
            el.videoGrid.innerHTML = `<p class="col-span-full text-red-400 text-center py-8">Không tải được gợi ý — kiểm tra khóa API</p>`;
        }
    }

    // Tải gợi ý bên phải khi đang phát
    async function loadSideSuggestions(title) {
        const q = title.split(' - ')[0].substring(0, 30);
        const results = await searchDirect(q + ' nhạc', true);
        suggestedList = results.filter(v => !playlist.length || v.id !== playlist[currentIdx]?.id).slice(0, 8);
        renderSuggestedList();
    }

    // ==================== HIỂN THỊ DANH SÁCH ====================
    function renderHomePage(list) {
        el.videoGrid.innerHTML = '';
        list.forEach(v => {
            const card = document.createElement('div');
            card.className = 'cursor-pointer card-hover transition-all duration-200';
            card.innerHTML = `
                <div class="relative rounded-xl overflow-hidden bg-gray-800 aspect-video mb-2">
                    <img src="${v.thumb}" alt="${v.title}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/400x225/272727/F1F1F1?text=Không+có+ảnh'">
                </div>
                <h3 class="font-medium line-clamp-2 text-sm sm:text-base">${v.title}</h3>
                <p class="text-xs sm:text-sm text-grayText mt-1">${v.channel}</p>
            `;
            card.onclick = () => playNow(v);
            el.videoGrid.appendChild(card);
        });
    }

    function renderSuggestedList() {
        if (!suggestedList.length) {
            el.suggestedList.innerHTML = `<p class="text-grayText text-sm py-4 text-center">Không có gợi ý</p>`;
            return;
        }
        el.suggestedList.innerHTML = '';
        suggestedList.forEach(v => {
            const isActive = playlist[currentIdx]?.id === v.id;
            const item = document.createElement('div');
            item.className = `suggest-item flex items-center gap-2 sm:gap-3 p-2 rounded-lg cursor-pointer transition ${isActive ? 'active' : ''}`;
            item.innerHTML = `
                <img src="${v.thumb}" alt="" class="w-20 h-12 sm:w-24 sm:h-14 rounded object-cover shrink-0" onerror="this.src='https://placehold.co/96x56/272727/F1F1F1?text=+'">
                <div class="flex-1 min-w-0">
                    <h4 class="text-sm font-medium line-clamp-2 ${isActive ? 'text-red' : ''}">${v.title}</h4>
                    <p class="text-xs text-grayText mt-0.5">${v.channel}</p>
                </div>
            `;
            item.onclick = () => playNow(v);
            el.suggestedList.appendChild(item);
        });
    }

    // ==================== CHUYỂN TRANG ====================
    function showPage(page) {
        el.homePage.classList.toggle('hidden', page !== 'home');
        el.watchPage.classList.toggle('hidden', page !== 'watch');
        [el.homeLink, el.favPageLink].forEach(link => link.classList.remove('active'));
        if (page === 'home') el.homeLink.classList.add('active');
    }

    // ==================== PHÁT NHẠC ====================
    function playNow(video) {
        if (!video) return;
        
        if (!playlist.some(x => x.id === video.id)) {
            playlist.push(video);
        }
        currentIdx = playlist.findIndex(x => x.id === video.id);
        
        el.watchTitle.textContent = video.title;
        el.watchChannel.textContent = video.channel;
        showPage('watch');
        showPlayerLoading();
        
        if (isPlayerReady && player) {
            actuallyPlayVideo(video.id);
        } else {
            pendingVideoId = video.id;
            // Đặt giới hạn chờ trình phát
            setTimeout(() => {
                if (pendingVideoId) {
                    pendingVideoId = null;
                    hidePlayerLoading();
                    alert("Trình phát chưa sẵn sàng, vui lòng thử lại");
                }
            }, 10000);
        }
        
        loadSideSuggestions(video.title);
        updateLikeButton();
    }

    function actuallyPlayVideo(videoId) {
        if (!player || !videoId) return;
        try {
            player.loadVideoById({ 
                videoId: videoId, 
                suggestedQuality: 'medium' 
            });
            player.playVideo();
        } catch (e) {
            console.error("Lỗi phát video:", e);
            hidePlayerLoading();
        }
    }

    function playNext() {
        if (!playlist.length) return;
        let next;
        if (isShuffle) {
            do { 
                next = Math.floor(Math.random() * playlist.length); 
            } while (next === currentIdx && playlist.length > 1);
        } else {
            next = currentIdx + 1;
            if (next >= playlist.length) {
                next = repeatMode === 1 ? 0 : currentIdx;
            }
        }
        playNow(playlist[next]);
    }

    function playPrev() {
        if (!isPlayerReady || currentIdx < 0 || !player) return;
        try {
            const t = player.getCurrentTime();
            if (t > 3) {
                player.seekTo(0);
            } else {
                playNow(playlist[currentIdx > 0 ? currentIdx - 1 : playlist.length - 1]);
            }
        } catch (e) {
            playNow(playlist[currentIdx > 0 ? currentIdx - 1 : playlist.length - 1]);
        }
    }

    function togglePlay() {
        if (!isPlayerReady || currentIdx === -1 || !player) return;
        try {
            isPlaying ? player.pauseVideo() : player.playVideo();
        } catch (e) {
            console.error("Lỗi điều khiển phát:", e);
        }
    }

    function updatePlayButton() {
        el.watchPlayPause.innerHTML = `<i class="fa fa-${isPlaying ? 'pause' : 'play'} ml-0.5 sm:ml-1 text-lg sm:text-xl"></i>`;
    }

    // ==================== YÊU THÍCH ====================
    function toggleLike() {
        if (currentIdx === -1) return;
        const v = playlist[currentIdx];
        const i = favorites.findIndex(x => x.id === v.id);
        i > -1 ? favorites.splice(i, 1) : favorites.unshift(v);
        localStorage.setItem('favMusic', JSON.stringify(favorites));
        updateLikeButton();
    }

    function updateLikeButton() {
        if (currentIdx === -1) return;
        const isFav = favorites.some(x => x.id === playlist[currentIdx].id);
        el.watchLike.innerHTML = `<i class="fa ${isFav ? 'fa-heart text-red' : 'fa-heart-o'}"></i><span>Yêu thích</span>`;
    }

    function showFavorites() {
        el.pageTitle.textContent = 'Bài hát yêu thích';
        if (!favorites.length) {
            el.videoGrid.innerHTML = `<p class="col-span-full text-grayText text-center py-12">Chưa có bài hát yêu thích</p>`;
            return;
        }
        renderHomePage(favorites);
        showPage('home');
    }

    // ==================== TIỆN ÍCH ====================
    function fmtTime(s) {
        if (!s || isNaN(s)) return '0:00';
        const m = Math.floor(s/60);
        const ss = Math.floor(s%60);
        return `${m}:${ss.toString().padStart(2,'0')}`;
    }

    // ==================== SỰ KIỆN ====================
    function setupEvents() {
        el.searchInput.addEventListener('keydown', e => e.key === 'Enter' && search(el.searchInput.value.trim()));
        el.searchBtn.addEventListener('click', () => search(el.searchInput.value.trim()));
        
        el.logoLink.addEventListener('click', e => { e.preventDefault(); showPage('home'); });
        el.homeLink.addEventListener('click', e => { e.preventDefault(); showPage('home'); });
        el.favPageLink.addEventListener('click', e => { e.preventDefault(); showFavorites(); });
        el.favBtn.addEventListener('click', e => { e.preventDefault(); showFavorites(); });
        
        el.watchPlayPause.addEventListener('click', togglePlay);
        el.watchNext.addEventListener('click', playNext);
        el.watchPrev.addEventListener('click', playPrev);
        
        el.watchShuffle.addEventListener('click', () => {
            isShuffle = !isShuffle;
            el.watchShuffle.classList.toggle('text-red', isShuffle);
            el.watchShuffle.classList.toggle('text-grayText', !isShuffle);
        });
        el.watchRepeat.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            el.watchRepeat.classList.toggle('text-red', repeatMode > 0);
            el.watchRepeat.classList.toggle('text-grayText', repeatMode === 0);
        });
        
        el.watchProgress.addEventListener('input', function() {
            if (!isPlayerReady || !player || !player.getDuration) return;
            player.seekTo((this.value / 100) * player.getDuration());
        });
        
        el.watchLike.addEventListener('click', toggleLike);
        
        // Tiếp tục phát khi quay lại tab
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPlaying && isPlayerReady && player) {
                try { player.playVideo(); } catch (e) {}
            }
        });
    }

    // ==================== KHỞI TẠO ====================
    loadAPI();
    setupEvents();
    loadSuggestions();
</script>
