<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicPlay YouTube">
    <title>MusicPlay - Nghe Nhạc YouTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F0F',
                        darkGray: '#272727',
                        hoverGray: '#3F3F3F',
                        red: '#FF0000',
                        lightText: '#F1F1F1',
                        grayText: '#AAAAAA'
                    },
                    fontFamily: { sans: ['Roboto', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        .progress-bar { -webkit-appearance: none; appearance: none; height: 4px; border-radius: 2px; background: #555; cursor: pointer; width: 100%; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #fff; cursor: pointer; opacity: 0; transition: opacity 0.2s; }
        .progress-bar:hover::-webkit-slider-thumb { opacity: 1; }
        .song-item:hover .play-icon { opacity: 1; }
        .playing-animation span { display: inline-block; width: 3px; height: 12px; margin: 0 1px; background: #FF0000; animation: playing 0.5s ease infinite alternate; }
        .playing-animation span:nth-child(2) { animation-delay: 0.15s; }
        .playing-animation span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes playing { from { height: 4px; } to { height: 14px; } }
        #youtube-player { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
        .player-visible #youtube-player { position: relative; opacity: 1; width: 100%; height: auto; pointer-events: auto; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-lightText font-sans antialiased">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-dark z-50 px-4 py-3 flex items-center justify-between border-b border-gray-800">
        <div class="flex items-center gap-4">
            <button id="sidebarToggle" class="p-2 hover:bg-darkGray rounded-full transition">
                <i class="fa fa-bars"></i>
            </button>
            <a href="#" class="flex items-center gap-1.5">
                <div class="bg-red rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fa fa-music text-white text-sm"></i>
                </div>
                <span class="font-bold text-lg hidden sm:inline">MusicPlay</span>
            </a>
        </div>

        <!-- Search Bar -->
        <div class="flex-1 max-w-[600px] mx-4">
            <div class="relative flex">
                <input type="text" id="searchInput" placeholder="Tìm kiếm bài hát, nghệ sĩ trên YouTube..." 
                    class="w-full px-4 py-2 bg-darkGray border border-gray-700 rounded-l-full focus:outline-none focus:border-red">
                <button id="searchBtn" class="px-6 bg-hoverGray border border-l-0 border-gray-700 rounded-r-full hover:bg-gray-600 transition">
                    <i class="fa fa-search"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="historyBtn" class="p-2 hover:bg-darkGray rounded-full transition" title="Lịch sử">
                <i class="fa fa-history"></i>
            </button>
            <div class="w-8 h-8 rounded-full bg-red flex items-center justify-center cursor-pointer">
                <span class="font-bold">U</span>
            </div>
        </div>
    </header>

    <!-- Main Layout -->
    <div class="flex pt-14">
        <!-- Sidebar -->
        <aside id="sidebar" class="w-60 fixed left-0 top-14 bottom-20 bg-dark overflow-y-auto transition-all duration-300 z-40">
            <div class="p-2">
                <ul class="space-y-1">
                    <li><a href="#" class="flex items-center gap-6 px-3 py-2.5 rounded-lg bg-hoverGray font-medium"><i class="fa fa-home w-5 text-center"></i><span>Trang chủ</span></a></li>
                    <li><a href="#" class="flex items-center gap-6 px-3 py-2.5 rounded-lg hover:bg-darkGray transition" id="queueLink"><i class="fa fa-list w-5 text-center"></i><span>Danh sách phát</span></a></li>
                    <li><a href="#" class="flex items-center gap-6 px-3 py-2.5 rounded-lg hover:bg-darkGray transition" id="favLink"><i class="fa fa-heart w-5 text-center"></i><span>Yêu thích</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- Main Content -->
        <main id="mainContent" class="flex-1 ml-60 pb-24 transition-all duration-300">
            <div class="p-4 md:p-6">
                <!-- Now Playing Section -->
                <section id="nowPlayingSection" class="mb-8 hidden">
                    <h2 class="text-xl font-bold mb-4">Đang phát</h2>
                    <div class="bg-darkGray rounded-xl p-4 md:p-6">
                        <div class="flex flex-col md:flex-row gap-6 items-start">
                            <div class="w-full md:w-2/5 max-w-[400px] mx-auto">
                                <div class="relative rounded-lg overflow-hidden shadow-lg aspect-video bg-black">
                                    <div id="youtube-player"></div>
                                </div>
                                <h3 id="currentTitle" class="text-xl font-bold mt-3">Tên bài hát</h3>
                                <p id="currentChannel" class="text-grayText mb-4">Kênh</p>
                            </div>
                            <div class="w-full md:w-3/5">
                                <div class="mb-4">
                                    <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
                                    <div class="flex justify-between text-xs text-grayText mt-1">
                                        <span id="currentTime">0:00</span>
                                        <span id="totalTime">0:00</span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-center gap-6 mb-6">
                                    <button id="shuffleBtn" class="text-grayText hover:text-white transition">
                                        <i class="fa fa-random fa-lg"></i>
                                    </button>
                                    <button id="prevBtn" class="text-lightText hover:text-white transition text-xl">
                                        <i class="fa fa-step-backward"></i>
                                    </button>
                                    <button id="playPauseBtn" class="w-14 h-14 bg-white rounded-full flex items-center justify-center text-dark hover:scale-105 transition">
                                        <i class="fa fa-play ml-1"></i>
                                    </button>
                                    <button id="nextBtn" class="text-lightText hover:text-white transition text-xl">
                                        <i class="fa fa-step-forward"></i>
                                    </button>
                                    <button id="repeatBtn" class="text-grayText hover:text-white transition">
                                        <i class="fa fa-repeat fa-lg"></i>
                                    </button>
                                </div>

                                <div class="flex items-center gap-3 justify-center">
                                    <i class="fa fa-volume-up text-grayText"></i>
                                    <input type="range" id="volumeBar" class="progress-bar flex-1 max-w-[150px]" min="0" max="100" value="70">
                                </div>

                                <div class="mt-6">
                                    <h4 class="font-medium mb-2">Danh sách chờ</h4>
                                    <div id="playlistQueue" class="space-y-2 max-h-[300px] overflow-y-auto">
                                        <!-- Danh sách phát -->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- Search Results -->
                <section id="searchSection">
                    <h2 class="text-xl font-bold mb-4" id="sectionTitle">Tìm kiếm trên YouTube</h2>
                    <div id="searchResults" class="space-y-3">
                        <p class="text-grayText text-center py-10">Nhập từ khóa để tìm kiếm bài hát trên YouTube</p>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Bottom Player Bar -->
    <div id="bottomPlayer" class="fixed bottom-0 left-0 right-0 bg-darkGray border-t border-gray-700 px-4 py-2 z-50 transform translate-y-full transition-transform duration-300">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <img id="miniThumb" src="" alt="" class="w-10 h-10 rounded object-cover bg-gray-700">
                <div class="min-w-0">
                    <h4 id="miniTitle" class="font-medium text-sm truncate">Tên bài hát</h4>
                    <p id="miniChannel" class="text-xs text-grayText truncate">Kênh</p>
                </div>
                <button id="miniLikeBtn" class="text-grayText hover:text-red transition ml-2">
                    <i class="fa fa-heart-o"></i>
                </button>
            </div>

            <div class="flex items-center gap-4 px-4">
                <button id="miniPrevBtn" class="text-grayText hover:text-white transition"><i class="fa fa-step-backward"></i></button>
                <button id="miniPlayPauseBtn" class="w-8 h-8 bg-white rounded-full flex items-center justify-center text-dark text-sm">
                    <i class="fa fa-play ml-0.5"></i>
                </button>
                <button id="miniNextBtn" class="text-grayText hover:text-white transition"><i class="fa fa-step-forward"></i></button>
            </div>

            <div class="hidden md:flex items-center gap-4 flex-1 justify-end">
                <span id="miniTime" class="text-xs text-grayText">0:00 / 0:00</span>
                <input type="range" id="miniProgress" class="progress-bar w-32" min="0" max="100" value="0">
                <button id="miniExpandBtn" class="text-grayText hover:text-white transition">
                    <i class="fa fa-chevron-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-[200] hidden">
        <div class="text-center">
            <i class="fa fa-spinner fa-spin fa-3x text-red"></i>
            <p class="mt-3">Đang tìm kiếm...</p>
        </div>
    </div>

    <script>
        // ==================== CẤU HÌNH ====================
        // Bạn cần lấy API Key từ Google Cloud Console (YouTube Data API v3)
        const YOUTUBE_API_KEY = "AIzaSyCPZf8Kws-Czw-6AIoZebDO_XTeCSZ2ni0";
        const YOUTUBE_SEARCH_URL = "https://www.googleapis.com/youtube/v3/search";
        const YOUTUBE_VIDEOS_URL = "https://www.googleapis.com/youtube/v3/videos";

        // ==================== TRẠNG THÁI ====================
        let player = null;
        let isPlayerReady = false;
        let playlist = [];
        let currentIndex = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0: tắt, 1: lặp danh sách, 2: lặp 1 bài
        let isPlaying = false;
        let favorites = JSON.parse(localStorage.getItem('favorites') || '[]');
        let searchHistory = JSON.parse(localStorage.getItem('searchHistory') || '[]');

        // ==================== PHẦN TỬ DOM ====================
        const el = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            searchResults: document.getElementById('searchResults'),
            sectionTitle: document.getElementById('sectionTitle'),
            nowPlayingSection: document.getElementById('nowPlayingSection'),
            bottomPlayer: document.getElementById('bottomPlayer'),
            
            currentTitle: document.getElementById('currentTitle'),
            currentChannel: document.getElementById('currentChannel'),
            progressBar: document.getElementById('progressBar'),
            currentTime: document.getElementById('currentTime'),
            totalTime: document.getElementById('totalTime'),
            playPauseBtn: document.getElementById('playPauseBtn'),
            prevBtn: document.getElementById('prevBtn'),
            nextBtn: document.getElementById('nextBtn'),
            shuffleBtn: document.getElementById('shuffleBtn'),
            repeatBtn: document.getElementById('repeatBtn'),
            volumeBar: document.getElementById('volumeBar'),
            
            miniThumb: document.getElementById('miniThumb'),
            miniTitle: document.getElementById('miniTitle'),
            miniChannel: document.getElementById('miniChannel'),
            miniPlayPauseBtn: document.getElementById('miniPlayPauseBtn'),
            miniPrevBtn: document.getElementById('miniPrevBtn'),
            miniNextBtn: document.getElementById('miniNextBtn'),
            miniProgress: document.getElementById('miniProgress'),
            miniTime: document.getElementById('miniTime'),
            miniExpandBtn: document.getElementById('miniExpandBtn'),
            miniLikeBtn: document.getElementById('miniLikeBtn'),
            
            playlistQueue: document.getElementById('playlistQueue'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            sidebar: document.getElementById('sidebar'),
            mainContent: document.getElementById('mainContent'),
            sidebarToggle: document.getElementById('sidebarToggle'),
            queueLink: document.getElementById('queueLink'),
            favLink: document.getElementById('favLink'),
            historyBtn: document.getElementById('historyBtn')
        };

        // ==================== TẢI YOUTUBE IFRAME API ====================
        function loadYouTubeAPI() {
            const tag = document.createElement('script');
            tag.src = "https://www.youtube.com/iframe_api";
            const firstScriptTag = document.getElementsByTagName('script')[0];
            firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
        }

        // Khởi tạo player khi API sẵn sàng
        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '315',
                width: '560',
                playerVars: {
                    autoplay: 0,
                    controls: 1,
                    disablekb: 0,
                    enablejsapi: 1,
                    origin: window.location.origin,
                    rel: 0,
                    showinfo: 0
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        };

        function onPlayerReady(event) {
            isPlayerReady = true;
            player.setVolume(70);
        }

        function onPlayerStateChange(event) {
            switch (event.data) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true;
                    updatePlayPauseButtons();
                    updateTimeDisplay();
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false;
                    updatePlayPauseButtons();
                    break;
                case YT.PlayerState.ENDED:
                    handleVideoEnd();
                    break;
                case YT.PlayerState.BUFFERING:
                    break;
            }
        }

        function onPlayerError(event) {
            console.error('Lỗi phát video:', event.data);
            setTimeout(playNext, 1500);
        }

        // ==================== TÌM KIẾM ====================
        async function searchYouTube(query) {
            if (!YOUTUBE_API_KEY || YOUTUBE_API_KEY.includes('xxxxxxxx')) {
                showError('Vui lòng cấu hình YouTube API Key trong mã nguồn');
                return;
            }

            el.loadingOverlay.classList.remove('hidden');
            
            try {
                // Tìm kiếm
                const searchRes = await fetch(
                    `${YOUTUBE_SEARCH_URL}?part=snippet&q=${encodeURIComponent(query + ' nhạc')}&type=video&videoCategoryId=10&maxResults=15&key=${YOUTUBE_API_KEY}`
                );
                const searchData = await searchRes.json();
                
                if (!searchData.items) {
                    showError('Không tìm thấy kết quả');
                    return;
                }

                // Lấy thời lượng
                const videoIds = searchData.items.map(item => item.id.videoId).join(',');
                const videosRes = await fetch(
                    `${YOUTUBE_VIDEOS_URL}?part=contentDetails&id=${videoIds}&key=${YOUTUBE_API_KEY}`
                );
                const videosData = await videosRes.json();

                // Kết hợp dữ liệu
                const results = searchData.items.map(item => {
                    const details = videosData.items?.find(v => v.id === item.id.videoId);
                    const duration = details?.contentDetails?.duration;
                    return {
                        id: item.id.videoId,
                        title: item.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                        channel: item.snippet.channelTitle,
                        thumbnail: item.snippet.thumbnails.medium.url,
                        duration: formatISODuration(duration)
                    };
                });

                renderSearchResults(results, query);
                saveSearchHistory(query);

            } catch (err) {
                console.error('Lỗi tìm kiếm:', err);
                showError('Lỗi kết nối, kiểm tra API Key');
            } finally {
                el.loadingOverlay.classList.add('hidden');
            }
        }

        function renderSearchResults(results, query) {
            el.sectionTitle.textContent = `Kết quả cho "${query}"`;
            el.searchResults.innerHTML = '';

            results.forEach(video => {
                const isFav = favorites.some(f => f.id === video.id);
                const card = document.createElement('div');
                card.className = 'flex gap-3 p-2 rounded-lg hover:bg-darkGray transition cursor-pointer group';
                card.innerHTML = `
                    <div class="relative w-40 h-24 flex-shrink-0 rounded-lg overflow-hidden bg-gray-800">
                        <img src="${video.thumbnail}" alt="" class="w-full h-full object-cover">
                        <span class="absolute bottom-1 right-1 bg-black/80 text-xs px-1 rounded">${video.duration}</span>
                        <button class="absolute inset-0 flex items-center justify-center bg-black/0 group-hover:bg-black/50 transition">
                            <i class="fa fa-play text-white opacity-0 group-hover:opacity-100 transition text-lg"></i>
                        </button>
                    </div>
                    <div class="flex-1 min-w-0 flex flex-col justify-center">
                        <h3 class="font-medium line-clamp-2">${video.title}</h3>
                        <p class="text-sm text-grayText mt-1">${video.channel}</p>
                    </div>
                    <button class="fav-btn self-center p-2 text-grayText hover:text-red transition ${isFav ? 'text-red' : ''}" data-id="${video.id}">
                        <i class="fa ${isFav ? 'fa-heart' : 'fa-heart-o'}"></i>
                    </button>
                `;
                
                card.addEventListener('click', (e) => {
                    if (!e.target.closest('.fav-btn')) {
                        addToQueueAndPlay(video);
                    }
                });
                
                card.querySelector('.fav-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleFavorite(video);
                    card.querySelector('.fav-btn').classList.toggle('text-red');
                    const icon = card.querySelector('.fav-btn i');
                    icon.className = `fa ${favorites.some(f => f.id === video.id) ? 'fa-heart' : 'fa-heart-o'}`;
                });
                
                el.searchResults.appendChild(card);
            });
        }

        // ==================== PHÁT NHẠC & QUẢN LÝ DANH SÁCH ====================
        function addToQueueAndPlay(video) {
            const exists = playlist.some(item => item.id === video.id);
            if (!exists) playlist.push(video);
            
            // Nếu chưa có gì đang phát, phát ngay
            if (currentIndex === -1) {
                playVideo(playlist.length - 1);
            } else {
                // Thêm vào cuối danh sách chờ
                renderQueue();
            }
        }

        function playVideo(index) {
            if (index < 0 || index >= playlist.length) return;
            
            currentIndex = index;
            const video = playlist[index];
            
            // Cập nhật giao diện
            el.currentTitle.textContent = video.title;
            el.currentChannel.textContent = video.channel;
            el.miniTitle.textContent = video.title;
            el.miniChannel.textContent = video.channel;
            el.miniThumb.src = video.thumbnail;
            
            // Phát qua YouTube Player
            if (isPlayerReady) {
                player.loadVideoById(video.id);
                player.playVideo();
                document.body.classList.add('player-visible');
            }
            
            // Hiển thị giao diện phát
            el.nowPlayingSection.classList.remove('hidden');
            el.bottomPlayer.classList.remove('translate-y-full');
            
            renderQueue();
            scrollToCurrent();
        }

        function handleVideoEnd() {
            if (repeatMode === 2) {
                player.seekTo(0);
                player.playVideo();
                return;
            }
            
            playNext();
        }

        function playNext() {
            if (playlist.length === 0) return;
            
            let nextIdx;
            if (isShuffle) {
                nextIdx = Math.floor(Math.random() * playlist.length);
                while (nextIdx === currentIndex && playlist.length > 1) {
                    nextIdx = Math.floor(Math.random() * playlist.length);
                }
            } else {
                nextIdx = currentIndex + 1;
                if (nextIdx >= playlist.length) {
                    if (repeatMode === 1) nextIdx = 0;
                    else return;
                }
            }
            playVideo(nextIdx);
        }

        function playPrev() {
            if (!player || !isPlayerReady) return;
            
            player.getCurrentTime().then(time => {
                if (time > 3) {
                    player.seekTo(0);
                    return;
                }
                let prevIdx = currentIndex - 1;
                if (prevIdx < 0) prevIdx = playlist.length - 1;
                playVideo(prevIdx);
            });
        }

        function togglePlayPause() {
            if (!player || !isPlayerReady || currentIndex === -1) return;
            
            if (isPlaying) player.pauseVideo();
            else player.playVideo();
        }

        function updatePlayPauseButtons() {
            const icon = isPlaying ? 'fa-pause' : 'fa-play';
            el.playPauseBtn.innerHTML = `<i class="fa ${icon} ${!isPlaying ? 'ml-1' : ''}"></i>`;
            el.miniPlayPauseBtn.innerHTML = `<i class="fa ${icon} ml-0.5"></i>`;
        }

        function updateTimeDisplay() {
            if (!player || !isPlayerReady) return;
            
            const current = player.getCurrentTime();
            const duration = player.getDuration();
            
            if (duration) {
                const progress = (current / duration) * 100;
                el.progressBar.value = progress;
                el.miniProgress.value = progress;
                el.currentTime.textContent = formatTime(current);
                el.totalTime.textContent = formatTime(duration);
                el.miniTime.textContent = `${formatTime(current)} / ${formatTime(duration)}`;
            }
            
            requestAnimationFrame(() => {
                if (isPlaying) updateTimeDisplay();
            });
        }

        function renderQueue() {
            el.playlistQueue.innerHTML = '';
            playlist.forEach((item, idx) => {
                const isCurrent = idx === currentIndex;
                const div = document.createElement('div');
                div.className = `flex items-center gap-2 p-2 rounded-lg transition ${isCurrent ? 'bg-hoverGray' : 'hover:bg-hoverGray/50'}`;
                div.innerHTML = `
                    <div class="w-6 text-center text-sm ${isCurrent && isPlaying ? 'text-red' : 'text-grayText'}">
                        ${isCurrent && isPlaying ? 
                            '<div class="playing-animation"><span></span><span></span><span></span></div>' : 
                            (idx + 1)}
                    </div>
                    <img src="${item.thumbnail}" alt="" class="w-8 h-8 rounded object-cover">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-medium truncate ${isCurrent ? 'text-red' : ''}">${item.title}</h4>
                        <p class="text-xs text-grayText truncate">${item.channel}</p>
                    </div>
                    <button class="remove-btn text-grayText hover:text-red p-1" data-idx="${idx}">
                        <i class="fa fa-times"></i>
                    </button>
                `;
                div.addEventListener('click', (e) => {
                    if (!e.target.closest('.remove-btn')) playVideo(idx);
                });
                div.querySelector('.remove-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    playlist.splice(idx, 1);
                    if (idx === currentIndex && playlist.length > 0) {
                        playVideo(Math.min(idx, playlist.length - 1));
                    } else if (currentIndex >= idx) {
                        currentIndex--;
                    }
                    renderQueue();
                });
                el.playlistQueue.appendChild(div);
            });
        }

        function scrollToCurrent() {
            setTimeout(() => {
                const items = el.playlistQueue.children;
                if (items[currentIndex]) {
                    items[currentIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 100);
        }

        // ==================== YÊU THÍCH & LỊCH SỬ ====================
        function toggleFavorite(video) {
            const idx = favorites.findIndex(f => f.id === video.id);
            if (idx > -1) favorites.splice(idx, 1);
            else favorites.unshift(video);
            localStorage.setItem('favorites', JSON.stringify(favorites));
        }

        function showFavorites() {
            el.sectionTitle.textContent = 'Bài hát yêu thích';
            if (!favorites.length) {
                el.searchResults.innerHTML = '<p class="text-grayText text-center py-8">Chưa có bài hát yêu thích</p>';
                return;
            }
            renderSearchResults(favorites, 'Bài hát yêu thích');
        }

        function saveSearchHistory(query) {
            const idx = searchHistory.indexOf(query);
            if (idx > -1) searchHistory.splice(idx, 1);
            searchHistory.unshift(query);
            searchHistory = searchHistory.slice(0, 10);
            localStorage.setItem('searchHistory', JSON.stringify(searchHistory));
        }

        // ==================== TIỆN ÍCH ====================
        function formatTime(secs) {
            if (!secs || isNaN(secs)) return '0:00';
            const m = Math.floor(secs / 60);
            const s = Math.floor(secs % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function formatISODuration(iso) {
            if (!iso) return '--:--';
            const match = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!match) return '--:--';
            const h = parseInt(match[1] || 0);
            const m = parseInt(match[2] || 0);
            const s = parseInt(match[3] || 0);
            if (h) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        function showError(msg) {
            el.searchResults.innerHTML = `<p class="text-red-400 text-center py-8">${msg}</p>`;
        }

        // ==================== SỰ KIỆN ====================
        function setupEvents() {
            el.searchBtn.addEventListener('click', () => searchYouTube(el.searchInput.value.trim()));
            el.searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && el.searchInput.value.trim()) {
                    searchYouTube(el.searchInput.value.trim());
                }
            });
            
            el.playPauseBtn.addEventListener('click', togglePlayPause);
            el.miniPlayPauseBtn.addEventListener('click', togglePlayPause);
            el.nextBtn.addEventListener('click', playNext);
            el.miniNextBtn.addEventListener('click', playNext);
            el.prevBtn.addEventListener('click', playPrev);
            el.miniPrevBtn.addEventListener('click', playPrev);
            
            el.shuffleBtn.addEventListener('click', () => {
                isShuffle = !isShuffle;
                el.shuffleBtn.classList.toggle('text-red', isShuffle);
                el.shuffleBtn.classList.toggle('text-grayText', !isShuffle);
            });
            
            el.repeatBtn.addEventListener('click', () => {
                repeatMode = (repeatMode + 1) % 3;
                el.repeatBtn.classList.toggle('text-red', repeatMode > 0);
                el.repeatBtn.classList.toggle('text-grayText', repeatMode === 0);
            });
            
            el.volumeBar.addEventListener('input', () => {
                if (player && isPlayerReady) player.setVolume(el.volumeBar.value);
            });
            
            el.progressBar.addEventListener('input', () => {
                if (!player || !isPlayerReady) return;
                const dur = player.getDuration();
                player.seekTo((el.progressBar.value / 100) * dur);
            });
            el.miniProgress.addEventListener('input', () => {
                if (!player || !isPlayerReady) return;
                const dur = player.getDuration();
                player.seekTo((el.miniProgress.value / 100) * dur);
            });
            
            el.miniExpandBtn.addEventListener('click', () => {
                el.nowPlayingSection.scrollIntoView({ behavior: 'smooth' });
            });
            
            el.sidebarToggle.addEventListener('click', () => {
                const hidden = el.sidebar.style.transform === 'translateX(-100%)';
                el.sidebar.style.transform = hidden ? 'translateX(0)' : 'translateX(-100%)';
                el.mainContent.style.marginLeft = hidden ? '15rem' : '0';
            });
            
            el.favLink.addEventListener('click', showFavorites);
            el.queueLink.addEventListener('click', () => {
                el.sectionTitle.textContent = 'Danh sách phát';
                el.searchResults.innerHTML = '<p class="text-grayText text-center py-8">Xem danh sách chờ ở phần "Đang phát"</p>';
            });
            
            // Giữ phát ngầm khi ẩn ứng dụng — quan trọng cho CarPlay
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && isPlaying && player) {
                    player.playVideo();
                }
            });
        }

        // ==================== KHỞI TẠO ====================
        loadYouTubeAPI();
        setupEvents();
    </script>
</body>
</html>
