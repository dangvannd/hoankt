<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicPlay">
    <meta name="format-detection" content="telephone=no">
    <title>MusicPlay — CarPlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F0F',
                        darkGray: '#272727',
                        hoverGray: '#3F3F3F',
                        red: '#FF0000',
                        lightText: '#F1F1F1',
                        grayText: '#AAAAAA'
                    },
                    fontFamily: { sans: ['Roboto', 'Arial', 'sans-serif'] },
                    screens: {
                        'car': '768px',
                        'xl': '1280px'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; margin: 0; }
        input, textarea { font-size: 16px !important; }
        .progress-bar { 
            -webkit-appearance: none; appearance: none; height: 8px; border-radius: 4px; 
            background: #444; cursor: pointer; width: 100%; 
        }
        .progress-bar::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 22px; height: 22px; border-radius: 50%; 
            background: #fff; cursor: pointer; 
        }
        .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; background: #000; }
        #youtube-player { width: 100%; height: 100%; border: none; display: block; }
        .player-loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; z-index: 10; }
        .player-loading.hidden { opacity: 0; pointer-events: none; }
        .card-hover:hover { transform: scale(1.03); transition: transform 0.2s ease; }
        .hide-scrollbar::-webkit-scrollbar { width: 6px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: #555; border-radius: 3px; }
        .btn-large { min-height: 48px; min-width: 48px; }
        .suggest-item:hover { background-color: rgba(255,255,255,0.08); }
        .suggest-item.active { background-color: rgba(255,0,0,0.15); }
        @media (min-width: 768px) {
            .sidebar-link { flex-direction: row; gap: 12px; padding: 12px 16px; }
            .sidebar-text { font-size: 15px; }
        }
    </style>
</head>
<body class="bg-dark text-lightText font-sans antialiased h-screen flex flex-col">
    <!-- Header -->
    <header class="shrink-0 bg-dark z-50 px-3 py-3 border-b border-gray-800/50">
        <div class="flex items-center gap-3">
            <a href="#" id="logoLink" class="flex items-center gap-2 shrink-0">
                <div class="bg-red rounded-full w-9 h-9 flex items-center justify-center">
                    <i class="fa fa-play text-white text-base ml-0.5"></i>
                </div>
                <span class="font-bold text-xl hidden sm:inline">MusicPlay</span>
            </a>
            <div class="flex-1 max-w-[720px] mx-2 relative">
                <div class="relative flex">
                    <input type="text" id="searchInput" placeholder="Tìm bài hát, nghệ sĩ..." 
                        class="w-full px-5 py-3 bg-darkGray border border-gray-700 rounded-l-full focus:outline-none focus:border-red text-base"
                        autocomplete="off">
                    <button id="searchBtn" class="px-6 bg-hoverGray border border-l-0 border-gray-700 rounded-r-full hover:bg-gray-600 transition btn-large">
                        <i class="fa fa-search text-lg"></i>
                    </button>
                </div>
            </div>
            <button id="favBtn" class="p-3 hover:bg-darkGray rounded-full transition btn-large shrink-0" title="Yêu thích">
                <i class="fa fa-heart text-lg"></i>
            </button>
        </div>
    </header>

    <!-- Bố cục chính -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Thanh bên trái -->
        <aside id="sidebar" class="w-[72px] car:w-[220px] bg-dark overflow-y-auto hide-scrollbar shrink-0 border-r border-gray-800/30">
            <div class="p-3 pt-5">
                <ul class="space-y-3">
                    <li>
                        <a href="#" id="homeLink" class="sidebar-link active flex items-center justify-center car:justify-start rounded-xl btn-large gap-3 p-3">
                            <i class="fa fa-home w-6 text-center text-xl"></i>
                            <span class="sidebar-text hidden car:inline">Trang chủ</span>
                        </a>
                    </li>
                    <li>
                        <a href="#" id="favLink" class="sidebar-link flex items-center justify-center car:justify-start rounded-xl btn-large gap-3 p-3">
                            <i class="fa fa-heart w-6 text-center text-xl"></i>
                            <span class="sidebar-text hidden car:inline">Yêu thích</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <!-- Nội dung chính -->
        <main class="flex-1 overflow-hidden flex flex-col">
            <!-- Trang chủ / Tìm kiếm -->
            <section id="homePage" class="flex-1 overflow-y-auto hide-scrollbar p-4">
                <h2 id="pageTitle" class="text-xl font-bold mb-4">🔥 Gợi ý cho bạn</h2>
                <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 car:grid-cols-3 xl:grid-cols-4 gap-4">
                    <p class="col-span-full text-grayText text-center py-16">Đang tải gợi ý...</p>
                </div>
            </section>

            <!-- Trang phát video + gợi ý bên phải -->
            <section id="watchPage" class="hidden flex-1 overflow-hidden">
                <div class="flex flex-col car:flex-row h-full gap-4 p-4">
                    <!-- Cột trái: Video chính -->
                    <div class="flex-1 flex flex-col min-w-0">
                        <div class="player-wrapper mb-4 relative">
                            <div id="playerLoading" class="player-loading">
                                <i class="fa fa-spinner fa-spin fa-3x text-red mb-4"></i>
                                <p class="text-grayText text-lg">Đang tải bài hát...</p>
                            </div>
                            <iframe id="youtube-player" frameborder="0" allowfullscreen 
                                allow="autoplay; encrypted-media; picture-in-picture; fullscreen; background-media-playback">
                            </iframe>
                        </div>
                        
                        <h1 id="watchTitle" class="text-xl font-bold mb-2 line-clamp-2">Tên bài hát</h1>
                        <p id="watchChannel" class="text-grayText mb-4 text-base">Tên nghệ sĩ</p>
                        
                        <!-- Thanh tiến độ -->
                        <div class="mb-4">
                            <input type="range" id="progressBar" class="progress-bar" min="0" max="100" value="0">
                            <div class="flex justify-between text-sm text-grayText mt-2">
                                <span id="timeCurrent">0:00</span>
                                <span id="timeTotal">0:00</span>
                            </div>
                        </div>
                        
                        <!-- Nút điều khiển lớn - dễ bấm trên xe -->
                        <div class="flex items-center justify-center gap-4 mb-5">
                            <button id="btnShuffle" class="text-grayText hover:text-white transition btn-large p-3" title="Xáo trộn">
                                <i class="fa fa-random fa-lg"></i>
                            </button>
                            <button id="btnPrev" class="text-lightText hover:text-white transition text-xl btn-large p-3" title="Bài trước">
                                <i class="fa fa-step-backward"></i>
                            </button>
                            <button id="btnPlayPause" class="w-16 h-16 bg-red rounded-full flex items-center justify-center text-white hover:bg-red/90 transition shadow-lg btn-large" title="Phát/Tạm dừng">
                                <i class="fa fa-play ml-1 text-xl"></i>
                            </button>
                            <button id="btnNext" class="text-lightText hover:text-white transition text-xl btn-large p-3" title="Bài tiếp theo">
                                <i class="fa fa-step-forward"></i>
                            </button>
                            <button id="btnRepeat" class="text-grayText hover:text-white transition btn-large p-3" title="Lặp lại">
                                <i class="fa fa-repeat fa-lg"></i>
                            </button>
                        </div>
                        
                        <div class="flex gap-3">
                            <button id="btnLike" class="flex items-center gap-2 px-5 py-3 bg-darkGray rounded-full hover:bg-hoverGray transition btn-large">
                                <i class="fa fa-heart-o"></i>
                                <span class="text-sm">Yêu thích</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Cột phải: Gợi ý tương tự -->
                    <div class="w-full car:w-[340px] shrink-0 flex flex-col min-w-0 border-t car:border-t-0 car:border-l border-gray-800/30 pt-4 car:pt-0 car:pl-4">
                        <h3 class="font-bold text-lg mb-3">🎵 Nghe tiếp & Gợi ý</h3>
                        <div id="suggestList" class="space-y-3 flex-1 overflow-y-auto hide-scrollbar pr-2">
                            <p class="text-grayText text-center py-6">Đang tải gợi ý...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="loadingOverlay" class="fixed inset-0 bg-black/70 flex items-center justify-center z-[200] hidden">
        <div class="text-center">
            <i class="fa fa-spinner fa-spin fa-3x text-red"></i>
            <p class="mt-4 text-lg">Đang tìm kiếm...</p>
        </div>
    </div>

    <script>
        // ==================== CẤU HÌNH — THAY KHÓA API BẰNG CỦA BẠN ====================
        const YOUTUBE_API_KEY = "AIzaSyBLdRYViV3FTtd6gsi7oS_EMojct7QL2Vc";
        const API_SEARCH = "https://www.googleapis.com/youtube/v3/search";
        
        // ==================== CHỦ ĐỀ GỢI Ý TRANG CHỦ ====================
        const HOME_TOPICS = [
            "nhạc vàng bolero hay nhất chọn lọc",
            "nhạc trữ tình thư giãn không lời",
            "nhạc trẻ Việt Nam hot nhất",
            "liên khúc nhạc vàng xưa bất hủ",
            "nhạc acoustic nhẹ nhàng",
            "nhạc không lời thư giãn lái xe",
            "nhạc remix Việt năng động",
            "nhạc phim hay nhất mọi thời đại"
        ];

        // ==================== TRẠNG THÁI ====================
        let player = null;
        let isPlayerReady = false;
        let playlist = [];
        let favorites = JSON.parse(localStorage.getItem('musicplay_fav') || '[]');
        let currentIdx = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0-tắt, 1-lặp danh sách, 2-lặp 1 bài
        let isPlaying = false;
        let suggestList = [];
        let pendingVideoId = null;
        let timeUpdateInterval = null;

        // ==================== PHẦN TỬ ====================
        const el = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            pageTitle: document.getElementById('pageTitle'),
            videoGrid: document.getElementById('videoGrid'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            logoLink: document.getElementById('logoLink'),
            homeLink: document.getElementById('homeLink'),
            favLink: document.getElementById('favLink'),
            favBtn: document.getElementById('favBtn'),
            homePage: document.getElementById('homePage'),
            watchPage: document.getElementById('watchPage'),
            playerLoading: document.getElementById('playerLoading'),
            youtubePlayer: document.getElementById('youtube-player'),
            watchTitle: document.getElementById('watchTitle'),
            watchChannel: document.getElementById('watchChannel'),
            progressBar: document.getElementById('progressBar'),
            timeCurrent: document.getElementById('timeCurrent'),
            timeTotal: document.getElementById('timeTotal'),
            btnPlayPause: document.getElementById('btnPlayPause'),
            btnPrev: document.getElementById('btnPrev'),
            btnNext: document.getElementById('btnNext'),
            btnShuffle: document.getElementById('btnShuffle'),
            btnRepeat: document.getElementById('btnRepeat'),
            btnLike: document.getElementById('btnLike'),
            suggestList: document.getElementById('suggestList')
        };

        // ==================== TRẠNG THÁI TẢI ====================
        function hideLoading() { el.playerLoading.classList.add('hidden'); }
        function showLoading() { el.playerLoading.classList.remove('hidden'); }

        // ==================== TẢI API YOUTUBE ====================
        function loadAPI() {
            const s = document.createElement('script');
            s.src = "https://www.youtube.com/iframe_api";
            s.async = true;
            document.head.appendChild(s);
        }

        window.onYouTubeIframeAPIReady = function() { initPlayer(); };

        function initPlayer() {
            if (!window.YT?.Player) { setTimeout(initPlayer, 200); return; }
            
            player = new YT.Player('youtube-player', {
                height: '100%', width: '100%',
                playerVars: { 
                    autoplay: 0, controls: 1, enablejsapi: 1,
                    origin: window.location.origin, rel: 0, modestbranding: 1,
                    playsinline: 1
                },
                events: { onReady: onReady, onStateChange: onState, onError: onErr }
            });
        }

        function onReady(e) {
            isPlayerReady = true;
            e.target.setVolume(80);
            hideLoading();
            if (pendingVideoId) { playVideoDirect(pendingVideoId); pendingVideoId = null; }
        }

        function onState(e) {
            switch (e.data) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true; hideLoading(); updatePlayBtn(); startTimeSync();
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false; updatePlayBtn(); stopTimeSync();
                    break;
                case YT.PlayerState.ENDED:
                    stopTimeSync();
                    repeatMode === 2 ? player.seekTo(0) : playNext();
                    break;
                case YT.PlayerState.BUFFERING:
                    showLoading(); break;
                case YT.PlayerState.CUED:
                    hideLoading(); break;
            }
        }

        function onErr(e) {
            console.error('Lỗi phát:', e.data);
            hideLoading();
            setTimeout(playNext, 3000); // Tự động chuyển bài sau lỗi
        }

        // Đồng bộ thời gian
        function startTimeSync() {
            stopTimeSync();
            timeUpdateInterval = setInterval(() => {
                if (!isPlayerReady || !player?.getDuration) return;
                const t = player.getCurrentTime(), d = player.getDuration();
                if (d && !isNaN(d)) {
                    el.progressBar.value = (t / d) * 100;
                    el.timeCurrent.textContent = fmtTime(t);
                    el.timeTotal.textContent = fmtTime(d);
                }
            }, 500);
        }
        function stopTimeSync() {
            if (timeUpdateInterval) clearInterval(timeUpdateInterval);
        }
        function fmtTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s/60), ss = Math.floor(s%60);
            return `${m}:${ss.toString().padStart(2,'0')}`;
        }

        // ==================== TÌM KIẾM ====================
        async function searchVideos(q, isSuggestion = false) {
            if (!q?.trim()) return [];
            if (!isSuggestion) el.loadingOverlay.classList.remove('hidden');
            
            try {
                const res = await fetch(
                    `${API_SEARCH}?part=snippet&q=${encodeURIComponent(q)}&type=video&videoCategoryId=10&maxResults=12&key=${YOUTUBE_API_KEY}`
                );
                if (!res.ok) throw new Error(res.status === 403 ? 'Khóa API không hợp lệ' : `Lỗi ${res.status}`);
                const data = await res.json();
                if (!data.items) return [];
                
                const results = data.items.map(i => ({
                    id: i.id.videoId,
                    title: i.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                    channel: i.snippet.channelTitle,
                    thumb: i.snippet.thumbnails?.high?.url || i.snippet.thumbnails?.default?.url
                }));
                
                if (!isSuggestion) {
                    el.pageTitle.textContent = `Kết quả: "${q}"`;
                    renderHome(results);
                    showPage('home');
                }
                return results;
            } catch (err) {
                console.error('Lỗi tìm kiếm:', err);
                if (!isSuggestion) alert(`Lỗi: ${err.message}\nKiểm tra khóa API!`);
                return [];
            } finally {
                if (!isSuggestion) el.loadingOverlay.classList.add('hidden');
            }
        }

        // Tải gợi ý trang chủ
        async function loadHomeSuggestions() {
            el.videoGrid.innerHTML = `<p class="col-span-full text-grayText text-center py-16">Đang tải gợi ý...</p>`;
            const randomTopic = HOME_TOPICS[Math.floor(Math.random() * HOME_TOPICS.length)];
            const results = await searchVideos(randomTopic, true);
            results.length ? renderHome(results) 
                : el.videoGrid.innerHTML = `<p class="col-span-full text-red-400 text-center py-16">Không tải được — kiểm tra khóa API</p>`;
        }

        // Tải gợi ý bên phải cùng chủ đề
        async function loadRelatedSuggestions(title) {
            const q = title.split(' - ')[0].substring(0, 35);
            const results = await searchVideos(q + ' nhạc', true);
            suggestList = results.filter(v => !playlist.length || v.id !== playlist[currentIdx]?.id).slice(0, 10);
            renderSuggestions();
        }

        // ==================== HIỂN THỊ DANH SÁCH ====================
        function renderHome(list) {
            el.videoGrid.innerHTML = '';
            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'cursor-pointer card-hover transition-all duration-200';
                card.innerHTML = `
                    <div class="relative rounded-xl overflow-hidden bg-gray-800 aspect-video mb-3">
                        <img src="${v.thumb}" alt="${v.title}" loading="lazy" 
                            class="w-full h-full object-cover" 
                            onerror="this.src='https://placehold.co/320x180/272727/F1F1F1?text=MusicPlay'">
                    </div>
                    <h3 class="font-medium line-clamp-2 text-base">${v.title}</h3>
                    <p class="text-sm text-grayText mt-1">${v.channel}</p>
                `;
                card.onclick = () => playNow(v);
                el.videoGrid.appendChild(card);
            });
        }

        function renderSuggestions() {
            if (!suggestList.length) {
                el.suggestList.innerHTML = `<p class="text-grayText text-center py-6">Không có gợi ý</p>`;
                return;
            }
            el.suggestList.innerHTML = '';
            suggestList.forEach(v => {
                const active = playlist[currentIdx]?.id === v.id;
                const item = document.createElement('div');
                item.className = `suggest-item flex items-center gap-3 p-3 rounded-xl cursor-pointer transition ${active ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${v.thumb}" alt="" class="w-24 h-14 rounded-lg object-cover shrink-0" 
                        onerror="this.src='https://placehold.co/96x56/272727/F1F1F1?text=+'">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-medium line-clamp-2 ${active ? 'text-red' : ''}">${v.title}</h4>
                        <p class="text-xs text-grayText mt-1">${v.channel}</p>
                    </div>
                `;
                item.onclick = () => playNow(v);
                el.suggestList.appendChild(item);
            });
        }

        // ==================== CHUYỂN TRANG ====================
        function showPage(page) {
            el.homePage.classList.toggle('hidden', page !== 'home');
            el.watchPage.classList.toggle('hidden', page !== 'watch');
            [el.homeLink, el.favLink].forEach(l => l.classList.remove('active', 'bg-white/10'));
            if (page === 'home') el.homeLink.classList.add('active', 'bg-white/10');
        }

        // ==================== PHÁT NHẠC ====================
        function playNow(video) {
            if (!video) return;
            if (!playlist.some(x => x.id === video.id)) playlist.push(video);
            currentIdx = playlist.findIndex(x => x.id === video.id);
            
            el.watchTitle.textContent = video.title;
            el.watchChannel.textContent = video.channel;
            showPage('watch');
            showLoading();
            
            isPlayerReady ? playVideoDirect(video.id) : (pendingVideoId = video.id);
            
            loadRelatedSuggestions(video.title);
            updateLikeUI();
        }

        function playVideoDirect(id) {
            player.loadVideoById({ videoId: id, suggestedQuality: 'medium' });
            player.playVideo();
        }

        function playNext() {
            if (!playlist.length) return;
            let next;
            if (isShuffle) {
                do { next = Math.floor(Math.random() * playlist.length); }
                while (next === currentIdx && playlist.length > 1);
            } else {
                next = currentIdx + 1;
                if (next >= playlist.length) next = repeatMode === 1 ? 0 : currentIdx;
            }
            playNow(playlist[next]);
        }

        function playPrev() {
            if (!isPlayerReady || currentIdx < 0) return;
            player.getCurrentTime() > 3 ? player.seekTo(0) 
                : playNow(playlist[currentIdx > 0 ? currentIdx - 1 : playlist.length - 1]);
        }

        function togglePlay() {
            if (!isPlayerReady || currentIdx === -1) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function updatePlayBtn() {
            el.btnPlayPause.innerHTML = `<i class="fa fa-${isPlaying ? 'pause' : 'play'} ml-1 text-xl"></i>`;
        }

        // ==================== YÊU THÍCH ====================
        function toggleLike() {
            if (currentIdx === -1) return;
            const v = playlist[currentIdx];
            const i = favorites.findIndex(x => x.id === v.id);
            i > -1 ? favorites.splice(i, 1) : favorites.unshift(v);
            localStorage.setItem('musicplay_fav', JSON.stringify(favorites));
            updateLikeUI();
        }

        function updateLikeUI() {
            if (currentIdx === -1) return;
            const isFav = favorites.some(x => x.id === playlist[currentIdx].id);
            el.btnLike.innerHTML = `<i class="fa ${isFav ? 'fa-heart text-red' : 'fa-heart-o'}"></i><span>Yêu thích</span>`;
        }

        function showFavoritesPage() {
            el.pageTitle.textContent = '❤️ Bài hát yêu thích';
            favorites.length ? renderHome(favorites) 
                : el.videoGrid.innerHTML = `<p class="col-span-full text-grayText text-center py-16">Chưa có bài hát yêu thích</p>`;
            showPage('home');
        }

        // ==================== SỰ KIỆN ====================
        function bindEvents() {
            el.searchInput.addEventListener('keydown', e => e.key === 'Enter' && searchVideos(el.searchInput.value.trim()));
            el.searchBtn.addEventListener('click', () => searchVideos(el.searchInput.value.trim()));
            
            el.logoLink.addEventListener('click', e => { e.preventDefault(); showPage('home'); });
            el.homeLink.addEventListener('click', e => { e.preventDefault(); showPage('home'); });
            el.favLink.addEventListener('click', e => { e.preventDefault(); showFavoritesPage(); });
            el.favBtn.addEventListener('click', e => { e.preventDefault(); showFavoritesPage(); });
            
            el.btnPlayPause.addEventListener('click', togglePlay);
            el.btnNext.addEventListener('click', playNext);
            el.btnPrev.addEventListener('click', playPrev);
            
            el.btnShuffle.addEventListener('click', () => {
                isShuffle = !isShuffle;
                el.btnShuffle.classList.toggle('text-red', isShuffle);
                el.btnShuffle.classList.toggle('text-grayText', !isShuffle);
            });
            el.btnRepeat.addEventListener('click', () => {
                repeatMode = (repeatMode + 1) % 3;
                el.btnRepeat.classList.toggle('text-red', repeatMode > 0);
                el.btnRepeat.classList.toggle('text-grayText', repeatMode === 0);
            });
            
            el.progressBar.addEventListener('input', function() {
                if (!isPlayerReady || !player?.getDuration) return;
                player.seekTo((this.value / 100) * player.getDuration());
            });
            
            el.btnLike.addEventListener('click', toggleLike);
            
            // ✅ TIẾP TỤC PHÁT NGẦM KHI CHUYỂN ỨNG DỤNG / MÀN HÌNH TẮT
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && isPlaying && isPlayerReady && player) {
                    try { player.playVideo(); } catch (e) {}
                }
            });
        }

        // ==================== KHỞI TẠO ====================
        loadAPI();
        bindEvents();
        loadHomeSuggestions();
    </script>
</body>
</html>
