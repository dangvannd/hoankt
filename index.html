<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicPlay">
    <title>MusicPlay - Nghe Nhạc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F0F',
                        darkGray: '#272727',
                        hoverGray: '#3F3F3F',
                        red: '#FF0000',
                        lightText: '#F1F1F1',
                        grayText: '#AAAAAA'
                    },
                    fontFamily: { sans: ['Roboto', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        .progress-bar { -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; background: #444; cursor: pointer; width: 100%; }
        .progress-bar::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: #fff; cursor: pointer; }
        .playing-animation span { display: inline-block; width: 4px; height: 14px; margin: 0 1px; background: #FF0000; animation: playing 0.6s ease infinite alternate; }
        .playing-animation span:nth-child(2) { animation-delay: 0.15s; }
        .playing-animation span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes playing { from { height: 6px; } to { height: 18px; } }
        #youtube-player { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
        .banner-gradient { background: linear-gradient(to bottom, transparent 0%, rgba(15,15,15,0.4) 60%, rgba(15,15,15,1) 100%); }
        .card-hover:hover { transform: scale(1.03); transition: transform 0.2s ease; }
        @media (min-width: 1200px) { .player-controls { gap: 2rem; } }
        @media (min-width: 1600px) { .player-controls { gap: 3rem; } .control-btn { font-size: 1.4rem; } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-lightText font-sans antialiased overflow-x-hidden">
    <!-- YouTube Player ẩn - phát nền -->
    <div id="youtube-player"></div>

    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 bg-dark/90 backdrop-blur-md z-50 px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-800/50">
        <div class="flex items-center gap-3">
            <a href="#" class="flex items-center gap-2">
                <div class="bg-red rounded-full w-9 h-9 flex items-center justify-center">
                    <i class="fa fa-music text-white"></i>
                </div>
                <span class="font-bold text-xl hidden sm:inline">MusicPlay</span>
            </a>
        </div>

        <div class="flex-1 max-w-[600px] mx-4">
            <div class="relative flex">
                <input type="text" id="searchInput" placeholder="Tìm kiếm bài hát, nghệ sĩ..." 
                    class="w-full px-5 py-2.5 bg-darkGray border border-gray-700 rounded-l-full focus:outline-none focus:border-red text-base">
                <button id="searchBtn" class="px-6 bg-hoverGray border border-l-0 border-gray-700 rounded-r-full hover:bg-gray-600 transition">
                    <i class="fa fa-search text-lg"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="favBtn" class="p-2.5 hover:bg-darkGray rounded-full transition" title="Yêu thích">
                <i class="fa fa-heart"></i>
            </button>
            <div class="w-9 h-9 rounded-full bg-red flex items-center justify-center cursor-pointer">
                <span class="font-bold">U</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="pt-16 pb-8">
        <!-- Banner Đang Phát - Giống giao diện YouTube -->
        <section id="heroSection" class="hidden relative">
            <div class="w-full h-[45vh] md:h-[55vh] lg:h-[60vh] overflow-hidden">
                <img id="heroBanner" src="" alt="" class="w-full h-full object-cover">
                <div class="banner-gradient absolute inset-0"></div>
            </div>
            
            <div class="px-4 md:px-8 -mt-24 md:-mt-32 relative z-10">
                <div class="flex flex-col md:flex-row gap-6 items-start">
                    <!-- Thông tin chính -->
                    <div class="flex-1">
                        <h1 id="heroTitle" class="text-xl md:text-2xl lg:text-3xl font-bold leading-tight mb-2 line-clamp-2">Tên bài hát</h1>
                        <p id="heroChannel" class="text-grayText text-base mb-4">Tên kênh / Nghệ sĩ</p>
                        
                        <!-- Thanh tiến độ -->
                        <div class="mb-4 max-w-2xl">
                            <input type="range" id="heroProgress" class="progress-bar" min="0" max="100" value="0">
                            <div class="flex justify-between text-sm text-grayText mt-1">
                                <span id="heroCurrent">0:00</span>
                                <span id="heroTotal">0:00</span>
                            </div>
                        </div>
                        
                        <!-- Nút điều khiển chính -->
                        <div class="flex items-center gap-4 md:gap-6 lg:gap-8 player-controls mb-4">
                            <button id="heroShuffle" class="text-grayText hover:text-white transition control-btn">
                                <i class="fa fa-random fa-lg"></i>
                            </button>
                            <button id="heroPrev" class="text-lightText hover:text-white transition text-xl control-btn">
                                <i class="fa fa-step-backward"></i>
                            </button>
                            <button id="heroPlayPause" class="w-14 h-14 md:w-16 md:h-16 bg-red rounded-full flex items-center justify-center text-white hover:bg-red/90 transition shadow-lg control-btn">
                                <i class="fa fa-play ml-1 text-xl"></i>
                            </button>
                            <button id="heroNext" class="text-lightText hover:text-white transition text-xl control-btn">
                                <i class="fa fa-step-forward"></i>
                            </button>
                            <button id="heroRepeat" class="text-grayText hover:text-white transition control-btn">
                                <i class="fa fa-repeat fa-lg"></i>
                            </button>
                        </div>
                        
                        <!-- Nút hành động -->
                        <div class="flex flex-wrap gap-3 mt-2">
                            <button id="heroLike" class="flex items-center gap-2 px-4 py-2 bg-darkGray rounded-full hover:bg-hoverGray transition">
                                <i class="fa fa-heart-o"></i>
                                <span>Yêu thích</span>
                            </button>
                            <button id="heroShare" class="flex items-center gap-2 px-4 py-2 bg-darkGray rounded-full hover:bg-hoverGray transition">
                                <i class="fa fa-share"></i>
                                <span>Chia sẻ</span>
                            </button>
                            <button id="heroQueueToggle" class="flex items-center gap-2 px-4 py-2 bg-darkGray rounded-full hover:bg-hoverGray transition">
                                <i class="fa fa-list"></i>
                                <span>Danh sách chờ</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Danh sách chờ bên phải -->
                    <div id="heroQueue" class="w-full md:w-[360px] lg:w-[400px] bg-darkGray/50 rounded-xl p-4 max-h-[400px] overflow-y-auto">
                        <h3 class="font-bold mb-3 flex items-center justify-between">
                            <span>Danh sách phát</span>
                            <span id="queueCount" class="text-sm text-grayText">0 bài</span>
                        </h3>
                        <div id="queueList" class="space-y-2">
                            <p class="text-grayText text-sm py-4 text-center">Chưa có bài hát nào</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Kết quả tìm kiếm / Đề xuất -->
        <section class="px-4 md:px-8 mt-8">
            <h2 id="sectionHeading" class="text-xl font-bold mb-4">Tìm kiếm bài hát</h2>
            <div id="resultsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4">
                <p class="col-span-full text-grayText text-center py-12">Nhập từ khóa ở trên để tìm kiếm bài hát trên YouTube</p>
            </div>
        </section>
    </main>

    <!-- Thanh phát nhỏ dưới cùng -->
    <div id="miniPlayer" class="fixed bottom-0 left-0 right-0 bg-darkGray border-t border-gray-700 px-4 py-3 z-50 transform translate-y-full transition-transform duration-300">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <img id="miniThumb" src="" alt="" class="w-12 h-12 rounded-lg object-cover bg-gray-700">
                <div class="min-w-0">
                    <h4 id="miniTitle" class="font-medium truncate">Tên bài hát</h4>
                    <p id="miniChannel" class="text-sm text-grayText truncate">Nghệ sĩ</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="miniPrev" class="text-grayText hover:text-white transition text-lg"><i class="fa fa-step-backward"></i></button>
                <button id="miniPlayPause" class="w-10 h-10 bg-red rounded-full flex items-center justify-center text-white">
                    <i class="fa fa-play ml-0.5"></i>
                </button>
                <button id="miniNext" class="text-grayText hover:text-white transition text-lg"><i class="fa fa-step-forward"></i></button>
            </div>

            <div class="hidden md:flex items-center gap-3 flex-1 justify-end">
                <span id="miniTime" class="text-xs text-grayText">0:00 / 0:00</span>
                <input type="range" id="miniProgress" class="progress-bar w-32" min="0" max="100" value="0">
                <button id="miniExpand" class="text-grayText hover:text-white transition">
                    <i class="fa fa-chevron-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] hidden">
        <div class="text-center">
            <i class="fa fa-spinner fa-spin fa-3x text-red"></i>
            <p class="mt-3 text-lg">Đang tìm kiếm...</p>
        </div>
    </div>

    <script>
        // ==================== CẤU HÌNH - ĐÃ ĐIỀN SẴN KHÓA API CỦA BẠN ====================
        const YOUTUBE_API_KEY = "AIzaSyCPZf8Kws-Czw-6AIoZebDO_XTeCSZ2ni0";
        
        const API_SEARCH = "https://www.googleapis.com/youtube/v3/search";
        const API_VIDEOS = "https://www.googleapis.com/youtube/v3/videos";

        // ==================== TRẠNG THÁI ====================
        let player = null;
        let isReady = false;
        let playlist = [];
        let currentIdx = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0: tắt, 1: lặp danh sách, 2: lặp 1 bài
        let isPlaying = false;
        let favorites = JSON.parse(localStorage.getItem('favMusic') || '[]');

        // ==================== PHẦN TỬ ====================
        const el = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            sectionHeading: document.getElementById('sectionHeading'),
            resultsGrid: document.getElementById('resultsGrid'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            heroSection: document.getElementById('heroSection'),
            
            heroBanner: document.getElementById('heroBanner'),
            heroTitle: document.getElementById('heroTitle'),
            heroChannel: document.getElementById('heroChannel'),
            heroProgress: document.getElementById('heroProgress'),
            heroCurrent: document.getElementById('heroCurrent'),
            heroTotal: document.getElementById('heroTotal'),
            heroPlayPause: document.getElementById('heroPlayPause'),
            heroPrev: document.getElementById('heroPrev'),
            heroNext: document.getElementById('heroNext'),
            heroShuffle: document.getElementById('heroShuffle'),
            heroRepeat: document.getElementById('heroRepeat'),
            heroLike: document.getElementById('heroLike'),
            heroQueue: document.getElementById('heroQueue'),
            queueList: document.getElementById('queueList'),
            queueCount: document.getElementById('queueCount'),
            
            miniPlayer: document.getElementById('miniPlayer'),
            miniThumb: document.getElementById('miniThumb'),
            miniTitle: document.getElementById('miniTitle'),
            miniChannel: document.getElementById('miniChannel'),
            miniPlayPause: document.getElementById('miniPlayPause'),
            miniPrev: document.getElementById('miniPrev'),
            miniNext: document.getElementById('miniNext'),
            miniProgress: document.getElementById('miniProgress'),
            miniTime: document.getElementById('miniTime'),
            miniExpand: document.getElementById('miniExpand'),
            
            favBtn: document.getElementById('favBtn')
        };

        // ==================== TẢI API YOUTUBE ====================
        function loadAPI() {
            const s = document.createElement('script');
            s.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(s);
        }

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '1', width: '1',
                playerVars: { autoplay: 0, controls: 0, enablejsapi: 1, origin: location.origin },
                events: {
                    onReady: e => { isReady = true; e.target.setVolume(75); },
                    onStateChange: handleState,
                    onError: () => setTimeout(playNext, 1500)
                }
            });
        };

        function handleState(e) {
            switch (e.data) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true;
                    updatePlayButtons();
                    updateTime();
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false;
                    updatePlayButtons();
                    break;
                case YT.PlayerState.ENDED:
                    repeatMode === 2 ? player.seekTo(0) : playNext();
                    break;
            }
        }

        // ==================== TÌM KIẾM ====================
        async function search(q) {
            if (!q) return;
            
            el.loadingOverlay.classList.remove('hidden');
            try {
                const sRes = await fetch(`${API_SEARCH}?part=snippet&q=${encodeURIComponent(q + ' nhạc')}&type=video&videoCategoryId=10&maxResults=12&key=${YOUTUBE_API_KEY}`);
                const sData = await sRes.json();
                if (!sData.items) throw Error('Không có kết quả');

                const ids = sData.items.map(i => i.id.videoId).join(',');
                const vRes = await fetch(`${API_VIDEOS}?part=contentDetails&id=${ids}&key=${YOUTUBE_API_KEY}`);
                const vData = await vRes.json();

                const list = sData.items.map(item => {
                    const v = vData.items?.find(x => x.id === item.id.videoId);
                    return {
                        id: item.id.videoId,
                        title: item.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                        channel: item.snippet.channelTitle,
                        thumb: item.snippet.thumbnails.high.url,
                        duration: formatDur(v?.contentDetails?.duration)
                    };
                });

                el.sectionHeading.textContent = `Kết quả cho "${q}"`;
                renderResults(list);
            } catch {
                el.resultsGrid.innerHTML = `<p class="col-span-full text-red-400 text-center py-12">Lỗi tìm kiếm, vui lòng thử lại</p>`;
            } finally {
                el.loadingOverlay.classList.add('hidden');
            }
        }

        function renderResults(list) {
            el.resultsGrid.innerHTML = '';
            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'cursor-pointer card-hover transition-all duration-200';
                card.innerHTML = `
                    <div class="relative rounded-xl overflow-hidden bg-gray-800 aspect-video mb-2">
                        <img src="${v.thumb}" alt="" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded">${v.duration}</span>
                        <div class="absolute inset-0 flex items-center justify-center bg-black/0 hover:bg-black/50 transition">
                            <i class="fa fa-play text-white text-2xl opacity-0 hover:opacity-100 transition"></i>
                        </div>
                    </div>
                    <h3 class="font-medium line-clamp-2">${v.title}</h3>
                    <p class="text-sm text-grayText mt-1">${v.channel}</p>
                `;
                card.onclick = () => addAndPlay(v);
                el.resultsGrid.appendChild(card);
            });
        }

        // ==================== PHÁT NHẠC ====================
        function addAndPlay(v) {
            if (!playlist.some(x => x.id === v.id)) playlist.push(v);
            if (currentIdx === -1) playAt(playlist.length - 1);
            else renderQueue();
        }

        function playAt(idx) {
            if (idx < 0 || idx >= playlist.length) return;
            currentIdx = idx;
            const v = playlist[idx];

            // Cập nhật giao diện
            el.heroBanner.src = v.thumb;
            el.heroTitle.textContent = v.title;
            el.heroChannel.textContent = v.channel;
            el.miniThumb.src = v.thumb;
            el.miniTitle.textContent = v.title;
            el.miniChannel.textContent = v.channel;
            
            if (isReady) { player.loadVideoById(v.id); player.playVideo(); }
            
            el.heroSection.classList.remove('hidden');
            el.miniPlayer.classList.remove('translate-y-full');
            
            renderQueue();
            updateLikeButton();
        }

        function playNext() {
            if (!playlist.length) return;
            let next;
            if (isShuffle) {
                do { next = Math.floor(Math.random() * playlist.length); }
                while (next === currentIdx && playlist.length > 1);
            } else {
                next = currentIdx + 1;
                if (next >= playlist.length) next = repeatMode === 1 ? 0 : currentIdx;
            }
            playAt(next);
        }

        function playPrev() {
            if (!isReady || currentIdx < 0) return;
            player.getCurrentTime().then(t => {
                if (t > 3) return player.seekTo(0);
                playAt(currentIdx > 0 ? currentIdx - 1 : playlist.length - 1);
            });
        }

        function togglePlay() {
            if (!isReady || currentIdx === -1) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function updatePlayButtons() {
            const icon = isPlaying ? 'fa-pause' : 'fa-play';
            el.heroPlayPause.innerHTML = `<i class="fa ${icon} ml-1 text-xl"></i>`;
            el.miniPlayPause.innerHTML = `<i class="fa ${icon} ml-0.5"></i>`;
        }

        function updateTime() {
            if (!isReady) return;
            const t = player.getCurrentTime(), d = player.getDuration();
            if (d) {
                const pct = (t / d) * 100;
                el.heroProgress.value = pct;
                el.miniProgress.value = pct;
                el.heroCurrent.textContent = fmtTime(t);
                el.heroTotal.textContent = fmtTime(d);
                el.miniTime.textContent = `${fmtTime(t)} / ${fmtTime(d)}`;
            }
            if (isPlaying) requestAnimationFrame(updateTime);
        }

        function renderQueue() {
            el.queueCount.textContent = `${playlist.length} bài`;
            el.queueList.innerHTML = '';
            playlist.forEach((item, i) => {
                const active = i === currentIdx;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-lg transition ${active ? 'bg-red/20' : 'hover:bg-hoverGray/50'}`;
                div.innerHTML = `
                    <div class="w-6 text-center text-sm ${active && isPlaying ? 'text-red' : 'text-grayText'}">
                        ${active && isPlaying ? '<div class="playing-animation"><span></span><span></span><span></span></div>' : i+1}
                    </div>
                    <img src="${item.thumb}" alt="" class="w-10 h-10 rounded object-cover">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-medium truncate ${active ? 'text-red' : ''}">${item.title}</h4>
                        <p class="text-xs text-grayText truncate">${item.channel}</p>
                    </div>
                    <button class="del-btn text-grayText hover:text-red p-1"><i class="fa fa-times"></i></button>
                `;
                div.onclick = e => !e.target.closest('.del-btn') && playAt(i);
                div.querySelector('.del-btn').onclick = e => {
                    e.stopPropagation();
                    playlist.splice(i, 1);
                    if (i === currentIdx && playlist.length) playAt(Math.min(i, playlist.length-1));
                    else if (currentIdx >= i) currentIdx--;
                    renderQueue();
                };
                el.queueList.appendChild(div);
            });
        }

        // ==================== YÊU THÍCH ====================
        function toggleLike() {
            if (currentIdx === -1) return;
            const v = playlist[currentIdx];
            const i = favorites.findIndex(x => x.id === v.id);
            i > -1 ? favorites.splice(i, 1) : favorites.unshift(v);
            localStorage.setItem('favMusic', JSON.stringify(favorites));
            updateLikeButton();
        }

        function updateLikeButton() {
            if (currentIdx === -1) return;
            const v = playlist[currentIdx];
            const isFav = favorites.some(x => x.id === v.id);
            el.heroLike.innerHTML = `<i class="fa ${isFav ? 'fa-heart text-red' : 'fa-heart-o'}"></i><span>Yêu thích</span>`;
        }

        function showFavorites() {
            el.sectionHeading.textContent = 'Bài hát yêu thích';
            if (!favorites.length) {
                el.resultsGrid.innerHTML = `<p class="col-span-full text-grayText text-center py-12">Chưa có bài hát yêu thích</p>`;
                return;
            }
            renderResults(favorites);
        }

        // ==================== TIỆN ÍCH ====================
        function fmtTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s/60), ss = Math.floor(s%60);
            return `${m}:${ss.toString().padStart(2,'0')}`;
        }
        function formatDur(iso) {
            if (!iso) return '--:--';
            const p = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!p) return '--:--';
            const h = parseInt(p[1]||0), m = parseInt(p[2]||0), s = parseInt(p[3]||0);
            return h ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : `${m}:${s.toString().padStart(2,'0')}`;
        }

        // ==================== SỰ KIỆN ====================
        function setupEvents() {
            el.searchBtn.onclick = () => search(el.searchInput.value.trim());
            el.searchInput.onkeypress = e => e.key === 'Enter' && search(el.searchInput.value.trim());
            
            el.heroPlayPause.onclick = el.miniPlayPause.onclick = togglePlay;
            el.heroNext.onclick = el.miniNext.onclick = playNext;
            el.heroPrev.onclick = el.miniPrev.onclick = playPrev;
            
            el.heroShuffle.onclick = () => {
                isShuffle = !isShuffle;
                el.heroShuffle.classList.toggle('text-red', isShuffle);
                el.heroShuffle.classList.toggle('text-grayText', !isShuffle);
            };
            el.heroRepeat.onclick = () => {
                repeatMode = (repeatMode + 1) % 3;
                el.heroRepeat.classList.toggle('text-red', repeatMode > 0);
                el.heroRepeat.classList.toggle('text-grayText', repeatMode === 0);
            };
            
            el.heroProgress.oninput = el.miniProgress.oninput = function() {
                if (!isReady) return;
                const d = player.getDuration();
                player.seekTo((this.value / 100) * d);
            };
            
            el.heroLike.onclick = toggleLike;
            el.favBtn.onclick = showFavorites;
            
            el.miniExpand.onclick = () => el.heroSection.scrollIntoView({behavior:'smooth'});
            
            // Giữ phát ngầm trên CarPlay
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && isPlaying && player) player.playVideo();
            });
        }

        // ==================== KHỞI TẠO ====================
        loadAPI();
        setupEvents();
    </script>
</body>
</html>
