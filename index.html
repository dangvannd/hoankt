<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicPlay">
    <title>MusicPlay - Nghe Nhạc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F0F',
                        darkGray: '#272727',
                        hoverGray: '#3F3F3F',
                        red: '#FF0000',
                        lightText: '#F1F1F1',
                        grayText: '#AAAAAA'
                    },
                    fontFamily: { sans: ['Roboto', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { 
            -webkit-tap-highlight-color: transparent; 
            box-sizing: border-box;
        }
        input, textarea {
            pointer-events: auto !important;
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .progress-bar { 
            -webkit-appearance: none; 
            appearance: none; 
            height: 6px; 
            border-radius: 3px; 
            background: #444; 
            cursor: pointer; 
            width: 100%; 
        }
        .progress-bar::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            width: 16px; 
            height: 16px; 
            border-radius: 50%; 
            background: #fff; 
            cursor: pointer; 
        }
        .playing-animation span { 
            display: inline-block; 
            width: 4px; 
            height: 14px; 
            margin: 0 1px; 
            background: #FF0000; 
            animation: playing 0.6s ease infinite alternate; 
        }
        .playing-animation span:nth-child(2) { animation-delay: 0.15s; }
        .playing-animation span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes playing { from { height: 6px; } to { height: 18px; } }
        /* Khung trình phát - hiển thị bình thường, không ẩn hoàn toàn nữa */
        #youtube-player { 
            width: 100%; 
            aspect-ratio: 16/9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
        }
        .card-hover:hover { transform: scale(1.03); transition: transform 0.2s ease; }
        .sidebar-link:hover { background-color: rgba(255,255,255,0.1); }
        .sidebar-link.active { background-color: rgba(255,255,255,0.15); font-weight: 500; }
        @media (min-width: 1920px) { .video-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }
        @media (min-width: 2560px) { .video-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-lightText font-sans antialiased overflow-x-hidden">
    <!-- Header Cố định -->
    <header class="fixed top-0 left-0 right-0 bg-dark z-50 px-4 md:px-6 py-3 flex items-center justify-between border-b border-gray-800/50">
        <div class="flex items-center gap-4">
            <button id="sidebarToggle" class="p-2 hover:bg-darkGray rounded-full transition">
                <i class="fa fa-bars"></i>
            </button>
            <a href="#" id="logoLink" class="flex items-center gap-1.5">
                <div class="bg-red rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fa fa-play text-white text-xs ml-0.5"></i>
                </div>
                <span class="font-bold text-xl hidden sm:inline">MusicPlay</span>
            </a>
        </div>

        <div class="flex-1 max-w-[640px] mx-4 relative z-10">
            <div class="relative flex">
                <input type="text" id="searchInput" placeholder="Tìm kiếm bài hát, nghệ sĩ..." 
                    class="w-full px-5 py-2.5 bg-darkGray border border-gray-700 rounded-l-full focus:outline-none focus:border-red text-base"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    spellcheck="false">
                <button id="searchBtn" class="px-6 bg-hoverGray border border-l-0 border-gray-700 rounded-r-full hover:bg-gray-600 transition">
                    <i class="fa fa-search text-lg"></i>
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button id="favBtn" class="p-2.5 hover:bg-darkGray rounded-full transition" title="Yêu thích">
                <i class="fa fa-heart"></i>
            </button>
            <div class="w-9 h-9 rounded-full bg-red flex items-center justify-center cursor-pointer">
                <span class="font-bold">U</span>
            </div>
        </div>
    </header>

    <!-- Bố cục chính -->
    <div class="flex pt-16">
        <!-- Thanh bên trái -->
        <aside id="sidebar" class="w-60 fixed left-0 top-14 bottom-16 bg-dark overflow-y-auto transition-all duration-300 z-40">
            <div class="p-2">
                <ul class="space-y-1">
                    <li><a href="#" id="homeLink" class="sidebar-link active flex items-center gap-6 px-3 py-2.5 rounded-lg"><i class="fa fa-home w-5 text-center"></i><span>Trang chủ</span></a></li>
                    <li><a href="#" id="favPageLink" class="sidebar-link flex items-center gap-6 px-3 py-2.5 rounded-lg"><i class="fa fa-heart w-5 text-center"></i><span>Yêu thích</span></a></li>
                    <li><a href="#" id="queuePageLink" class="sidebar-link flex items-center gap-6 px-3 py-2.5 rounded-lg"><i class="fa fa-list w-5 text-center"></i><span>Danh sách phát</span></a></li>
                </ul>
            </div>
        </aside>

        <!-- Nội dung chính -->
        <main id="mainContent" class="flex-1 ml-60 pb-20 transition-all duration-300">
            <!-- Trang chủ - Lưới video giống YouTube -->
            <section id="homePage" class="p-4 md:p-6">
                <h2 id="pageTitle" class="text-xl font-bold mb-4">Tìm kiếm bài hát</h2>
                <div id="videoGrid" class="video-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <p class="col-span-full text-grayText text-center py-12">Nhập từ khóa ở trên để tìm kiếm bài hát trên YouTube</p>
                </div>
            </section>

            <!-- Trang phát nhạc - Giống trang xem video YouTube -->
            <section id="watchPage" class="hidden p-4 md:p-6">
                <div class="flex flex-col lg:flex-row gap-6">
                    <!-- Cột trái: Phát nhạc chính -->
                    <div class="flex-1">
                        <!-- Khung trình phát YouTube hiển thị bình thường -->
                        <div id="youtube-player"></div>
                        
                        <!-- Thông tin bài hát -->
                        <h1 id="watchTitle" class="text-xl md:text-2xl font-bold mt-4 mb-2 line-clamp-2">Tên bài hát</h1>
                        <p id="watchChannel" class="text-grayText mb-4">Tên kênh / Nghệ sĩ</p>
                        
                        <!-- Thanh tiến độ -->
                        <div class="mb-4">
                            <input type="range" id="watchProgress" class="progress-bar" min="0" max="100" value="0">
                            <div class="flex justify-between text-sm text-grayText mt-1">
                                <span id="watchCurrent">0:00</span>
                                <span id="watchTotal">0:00</span>
                            </div>
                        </div>
                        
                        <!-- Nút điều khiển chính -->
                        <div class="flex items-center gap-4 md:gap-6 mb-6">
                            <button id="watchShuffle" class="text-grayText hover:text-white transition">
                                <i class="fa fa-random fa-lg"></i>
                            </button>
                            <button id="watchPrev" class="text-lightText hover:text-white transition text-xl">
                                <i class="fa fa-step-backward"></i>
                            </button>
                            <button id="watchPlayPause" class="w-14 h-14 bg-red rounded-full flex items-center justify-center text-white hover:bg-red/90 transition shadow-lg">
                                <i class="fa fa-play ml-1 text-xl"></i>
                            </button>
                            <button id="watchNext" class="text-lightText hover:text-white transition text-xl">
                                <i class="fa fa-step-forward"></i>
                            </button>
                            <button id="watchRepeat" class="text-grayText hover:text-white transition">
                                <i class="fa fa-repeat fa-lg"></i>
                            </button>
                        </div>
                        
                        <!-- Nút hành động -->
                        <div class="flex flex-wrap gap-3 mb-6">
                            <button id="watchLike" class="flex items-center gap-2 px-4 py-2 bg-darkGray rounded-full hover:bg-hoverGray transition">
                                <i class="fa fa-heart-o"></i>
                                <span>Yêu thích</span>
                            </button>
                            <button id="watchShare" class="flex items-center gap-2 px-4 py-2 bg-darkGray rounded-full hover:bg-hoverGray transition">
                                <i class="fa fa-share"></i>
                                <span>Chia sẻ</span>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Cột phải: Danh sách phát liên quan -->
                    <div class="w-full lg:w-[400px] xl:w-[450px]">
                        <h3 class="font-bold mb-3">Danh sách phát</h3>
                        <div id="relatedList" class="space-y-3 max-h-[70vh] overflow-y-auto">
                            <p class="text-grayText text-sm py-4 text-center">Chưa có bài hát nào</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Thanh phát nhỏ dưới cùng - Luôn hiển thị khi đang phát -->
    <div id="miniPlayer" class="fixed bottom-0 left-0 right-0 bg-darkGray border-t border-gray-700 px-4 py-3 z-50 transform translate-y-full transition-transform duration-300">
        <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <img id="miniThumb" src="" alt="" class="w-12 h-12 rounded-lg object-cover bg-gray-700">
                <div class="min-w-0">
                    <h4 id="miniTitle" class="font-medium truncate">Tên bài hát</h4>
                    <p id="miniChannel" class="text-sm text-grayText truncate">Nghệ sĩ</p>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <button id="miniPrev" class="text-grayText hover:text-white transition text-lg"><i class="fa fa-step-backward"></i></button>
                <button id="miniPlayPause" class="w-10 h-10 bg-red rounded-full flex items-center justify-center text-white">
                    <i class="fa fa-play ml-0.5"></i>
                </button>
                <button id="miniNext" class="text-grayText hover:text-white transition text-lg"><i class="fa fa-step-forward"></i></button>
            </div>

            <div class="hidden md:flex items-center gap-3 flex-1 justify-end">
                <span id="miniTime" class="text-xs text-grayText">0:00 / 0:00</span>
                <input type="range" id="miniProgress" class="progress-bar w-32" min="0" max="100" value="0">
                <button id="miniExpand" class="text-grayText hover:text-white transition">
                    <i class="fa fa-chevron-up"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/60 flex items-center justify-center z-[200] hidden">
        <div class="text-center">
            <i class="fa fa-spinner fa-spin fa-3x text-red"></i>
            <p class="mt-3 text-lg">Đang tìm kiếm...</p>
        </div>
    </div>

    <script>
        // ==================== CẤU HÌNH - ĐÃ ĐIỀN SẴN API CỦA BẠN ====================
        const YOUTUBE_API_KEY = "AIzaSyCPZf8Kws-Czw-6AIoZebDO_XTeCSZ2ni0";
        
        const API_SEARCH = "https://www.googleapis.com/youtube/v3/search";
        const API_VIDEOS = "https://www.googleapis.com/youtube/v3/videos";

        // ==================== TRẠNG THÁI ====================
        let player = null;
        let isReady = false;
        let playlist = [];
        let currentIdx = -1;
        let isShuffle = false;
        let repeatMode = 0; // 0: tắt, 1: lặp danh sách, 2: lặp 1 bài
        let isPlaying = false;
        let favorites = JSON.parse(localStorage.getItem('favMusic') || '[]');
        let currentSearchResults = [];

        // ==================== PHẦN TỬ ====================
        const el = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            pageTitle: document.getElementById('pageTitle'),
            videoGrid: document.getElementById('videoGrid'),
            loadingOverlay: document.getElementById('loadingOverlay'),
            sidebar: document.getElementById('sidebar'),
            mainContent: document.getElementById('mainContent'),
            sidebarToggle: document.getElementById('sidebarToggle'),
            logoLink: document.getElementById('logoLink'),
            homeLink: document.getElementById('homeLink'),
            favPageLink: document.getElementById('favPageLink'),
            queuePageLink: document.getElementById('queuePageLink'),
            favBtn: document.getElementById('favBtn'),
            
            homePage: document.getElementById('homePage'),
            watchPage: document.getElementById('watchPage'),
            
            watchTitle: document.getElementById('watchTitle'),
            watchChannel: document.getElementById('watchChannel'),
            watchProgress: document.getElementById('watchProgress'),
            watchCurrent: document.getElementById('watchCurrent'),
            watchTotal: document.getElementById('watchTotal'),
            watchPlayPause: document.getElementById('watchPlayPause'),
            watchPrev: document.getElementById('watchPrev'),
            watchNext: document.getElementById('watchNext'),
            watchShuffle: document.getElementById('watchShuffle'),
            watchRepeat: document.getElementById('watchRepeat'),
            watchLike: document.getElementById('watchLike'),
            relatedList: document.getElementById('relatedList'),
            
            miniPlayer: document.getElementById('miniPlayer'),
            miniThumb: document.getElementById('miniThumb'),
            miniTitle: document.getElementById('miniTitle'),
            miniChannel: document.getElementById('miniChannel'),
            miniPlayPause: document.getElementById('miniPlayPause'),
            miniPrev: document.getElementById('miniPrev'),
            miniNext: document.getElementById('miniNext'),
            miniProgress: document.getElementById('miniProgress'),
            miniTime: document.getElementById('miniTime'),
            miniExpand: document.getElementById('miniExpand')
        };

        // ==================== TẢI API YOUTUBE - TRÌNH PHÁT HIỂN THỊ BÌNH THƯỜNG ====================
        function loadAPI() {
            const s = document.createElement('script');
            s.src = "https://www.youtube.com/iframe_api";
            document.head.appendChild(s);
        }

        window.onYouTubeIframeAPIReady = function() {
            player = new YT.Player('youtube-player', {
                height: '360',
                width: '640',
                playerVars: { 
                    autoplay: 0, 
                    controls: 1,       // Hiển thị nút điều khiển YouTube
                    enablejsapi: 1, 
                    origin: location.origin,
                    rel: 0,
                    showinfo: 0,
                    modestbranding: 1
                },
                events: {
                    onReady: e => { 
                        isReady = true; 
                        e.target.setVolume(75); 
                        console.log('✅ Trình phát YouTube đã sẵn sàng');
                    },
                    onStateChange: handleState,
                    onError: (e) => {
                        console.error('❌ Lỗi phát:', e.data);
                        setTimeout(playNext, 1500);
                    }
                }
            });
        };

        function handleState(e) {
            console.log('📌 Trạng thái phát:', e.data);
            switch (e.data) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true;
                    updatePlayButtons();
                    updateTime();
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false;
                    updatePlayButtons();
                    break;
                case YT.PlayerState.ENDED:
                    repeatMode === 2 ? player.seekTo(0) : playNext();
                    break;
            }
        }

        // ==================== TÌM KIẾM ====================
        async function search(q) {
            if (!q || q.trim() === '') return;
            
            el.loadingOverlay.classList.remove('hidden');
            try {
                const sRes = await fetch(`${API_SEARCH}?part=snippet&q=${encodeURIComponent(q + ' nhạc')}&type=video&videoCategoryId=10&maxResults=12&key=${YOUTUBE_API_KEY}`);
                const sData = await sRes.json();
                if (!sData.items) throw Error('Không có kết quả');

                const ids = sData.items.map(i => i.id.videoId).join(',');
                const vRes = await fetch(`${API_VIDEOS}?part=contentDetails&id=${ids}&key=${YOUTUBE_API_KEY}`);
                const vData = await vRes.json();

                currentSearchResults = sData.items.map(item => {
                    const v = vData.items?.find(x => x.id === item.id.videoId);
                    return {
                        id: item.id.videoId,
                        title: item.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                        channel: item.snippet.channelTitle,
                        thumb: item.snippet.thumbnails.high.url,
                        duration: formatDur(v?.contentDetails?.duration)
                    };
                });

                el.pageTitle.textContent = `Kết quả cho "${q}"`;
                renderHomePage(currentSearchResults);
                showPage('home');
            } catch (err) {
                console.error('Lỗi tìm kiếm:', err);
                el.videoGrid.innerHTML = `<p class="col-span-full text-red-400 text-center py-12">Lỗi tìm kiếm: ${err.message}</p>`;
            } finally {
                el.loadingOverlay.classList.add('hidden');
            }
        }

        function renderHomePage(list) {
            el.videoGrid.innerHTML = '';
            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'cursor-pointer card-hover transition-all duration-200';
                card.innerHTML = `
                    <div class="relative rounded-xl overflow-hidden bg-gray-800 aspect-video mb-2">
                        <img src="${v.thumb}" alt="" class="w-full h-full object-cover">
                        <span class="absolute bottom-2 right-2 bg-black/80 text-xs px-1.5 py-0.5 rounded">${v.duration}</span>
                    </div>
                    <h3 class="font-medium line-clamp-2">${v.title}</h3>
                    <p class="text-sm text-grayText mt-1">${v.channel}</p>
                `;
                card.onclick = () => {
                    if (!playlist.some(x => x.id === v.id)) playlist.push(v);
                    playAt(playlist.length - 1);
                };
                el.videoGrid.appendChild(card);
            });
        }

        // ==================== CHUYỂN TRANG ====================
        function showPage(page) {
            el.homePage.classList.toggle('hidden', page !== 'home');
            el.watchPage.classList.toggle('hidden', page !== 'watch');
            
            [el.homeLink, el.favPageLink, el.queuePageLink].forEach(link => link.classList.remove('active'));
            if (page === 'home') el.homeLink.classList.add('active');
        }

        // ==================== PHÁT NHẠC ====================
        function playAt(idx) {
            if (idx < 0 || idx >= playlist.length) return;
            currentIdx = idx;
            const v = playlist[idx];

            console.log('▶️ Phát:', v.title, 'ID:', v.id);

            // Cập nhật giao diện trang phát
            el.watchTitle.textContent = v.title;
            el.watchChannel.textContent = v.channel;
            
            // Cập nhật thanh phát dưới
            el.miniThumb.src = v.thumb;
            el.miniTitle.textContent = v.title;
            el.miniChannel.textContent = v.channel;
            
            if (isReady) { 
                player.loadVideoById({ videoId: v.id, suggestedQuality: 'hd720' });
                player.playVideo(); 
            } else {
                console.warn('⏳ Trình phát chưa sẵn sàng');
            }
            
            el.miniPlayer.classList.remove('translate-y-full');
            renderRelatedList();
            updateLikeButton();
            showPage('watch');
        }

        function playNext() {
            if (!playlist.length) return;
            let next;
            if (isShuffle) {
                do { next = Math.floor(Math.random() * playlist.length); }
                while (next === currentIdx && playlist.length > 1);
            } else {
                next = currentIdx + 1;
                if (next >= playlist.length) next = repeatMode === 1 ? 0 : currentIdx;
            }
            playAt(next);
        }

        function playPrev() {
            if (!isReady || currentIdx < 0) return;
            player.getCurrentTime().then(t => {
                if (t > 3) return player.seekTo(0);
                playAt(currentIdx > 0 ? currentIdx - 1 : playlist.length - 1);
            });
        }

        function togglePlay() {
            if (!isReady || currentIdx === -1) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function updatePlayButtons() {
            const icon = isPlaying ? 'fa-pause' : 'fa-play';
            el.watchPlayPause.innerHTML = `<i class="fa ${icon} ml-1 text-xl"></i>`;
            el.miniPlayPause.innerHTML = `<i class="fa ${icon} ml-0.5"></i>`;
        }

        function updateTime() {
            if (!isReady) return;
            const t = player.getCurrentTime(), d = player.getDuration();
            if (d) {
                const pct = (t / d) * 100;
                el.watchProgress.value = pct;
                el.miniProgress.value = pct;
                el.watchCurrent.textContent = fmtTime(t);
                el.watchTotal.textContent = fmtTime(d);
                el.miniTime.textContent = `${fmtTime(t)} / ${fmtTime(d)}`;
            }
            if (isPlaying) requestAnimationFrame(updateTime);
        }

        function renderRelatedList() {
            el.relatedList.innerHTML = '';
            playlist.forEach((item, i) => {
                const active = i === currentIdx;
                const div = document.createElement('div');
                div.className = `flex items-center gap-3 p-2 rounded-lg transition ${active ? 'bg-hoverGray' : 'hover:bg-hoverGray/50'}`;
                div.innerHTML = `
                    <div class="w-6 text-center text-sm ${active && isPlaying ? 'text-red' : 'text-grayText'}">
                        ${active && isPlaying ? '<div class="playing-animation"><span></span><span></span><span></span></div>' : i+1}
                    </div>
                    <img src="${item.thumb}" alt="" class="w-16 h-9 rounded object-cover">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-medium line-clamp-2 ${active ? 'text-red' : ''}">${item.title}</h4>
                        <p class="text-xs text-grayText mt-0.5">${item.channel}</p>
                    </div>
                    <button class="del-btn text-grayText hover:text-red p-1"><i class="fa fa-times"></i></button>
                `;
                div.onclick = e => !e.target.closest('.del-btn') && playAt(i);
                div.querySelector('.del-btn').onclick = e => {
                    e.stopPropagation();
                    playlist.splice(i, 1);
                    if (i === currentIdx && playlist.length) playAt(Math.min(i, playlist.length-1));
                    else if (currentIdx >= i) currentIdx--;
                    renderRelatedList();
                };
                el.relatedList.appendChild(div);
            });
        }

        // ==================== YÊU THÍCH ====================
        function toggleLike() {
            if (currentIdx === -1) return;
            const v = playlist[currentIdx];
            const i = favorites.findIndex(x => x.id === v.id);
            i > -1 ? favorites.splice(i, 1) : favorites.unshift(v);
            localStorage.setItem('favMusic', JSON.stringify(favorites));
            updateLikeButton();
        }

        function updateLikeButton() {
            if (currentIdx === -1) return;
            const v = playlist[currentIdx];
            const isFav = favorites.some(x => x.id === v.id);
            el.watchLike.innerHTML = `<i class="fa ${isFav ? 'fa-heart text-red' : 'fa-heart-o'}"></i><span>Yêu thích</span>`;
        }

        function showFavorites() {
            el.pageTitle.textContent = 'Bài hát yêu thích';
            if (!favorites.length) {
                el.videoGrid.innerHTML = `<p class="col-span-full text-grayText text-center py-12">Chưa có bài hát yêu thích</p>`;
                return;
            }
            renderHomePage(favorites);
            showPage('home');
        }

        // ==================== TIỆN ÍCH ====================
        function fmtTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s/60), ss = Math.floor(s%60);
            return `${m}:${ss.toString().padStart(2,'0')}`;
        }
        function formatDur(iso) {
            if (!iso) return '--:--';
            const p = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
            if (!p) return '--:--';
            const h = parseInt(p[1]||0), m = parseInt(p[2]||0), s = parseInt(p[3]||0);
            return h ? `${h}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}` : `${m}:${s.toString().padStart(2,'0')}`;
        }

        // ==================== SỰ KIỆN ====================
        function setupEvents() {
            // Ô tìm kiếm
            el.searchInput.addEventListener('focus', function() {
                this.style.pointerEvents = 'auto';
            });
            
            el.searchBtn.addEventListener('click', (e) => {
                e.preventDefault();
                search(el.searchInput.value.trim());
            });
            
            el.searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    search(el.searchInput.value.trim());
                }
            });
            
            el.logoLink.onclick = el.homeLink.onclick = (e) => {
                e.preventDefault();
                if (currentSearchResults.length) renderHomePage(currentSearchResults);
                showPage('home');
            };
            el.favPageLink.onclick = el.favBtn.onclick = (e) => {
                e.preventDefault();
                showFavorites();
            };
            
            el.sidebarToggle.onclick = () => {
                const hidden = el.sidebar.style.transform === 'translateX(-100%)';
                el.sidebar.style.transform = hidden ? 'translateX(0)' : 'translateX(-100%)';
                el.mainContent.style.marginLeft = hidden ? '15rem' : '0';
            };
            
            el.watchPlayPause.onclick = el.miniPlayPause.onclick = togglePlay;
            el.watchNext.onclick = el.miniNext.onclick = playNext;
            el.watchPrev.onclick = el.miniPrev.onclick = playPrev;
            
            el.watchShuffle.onclick = () => {
                isShuffle = !isShuffle;
                el.watchShuffle.classList.toggle('text-red', isShuffle);
                el.watchShuffle.classList.toggle('text-grayText', !isShuffle);
            };
            el.watchRepeat.onclick = () => {
                repeatMode = (repeatMode + 1) % 3;
                el.watchRepeat.classList.toggle('text-red', repeatMode > 0);
                el.watchRepeat.classList.toggle('text-grayText', repeatMode === 0);
            };
            
            el.watchProgress.oninput = el.miniProgress.oninput = function() {
                if (!isReady) return;
                const d = player.getDuration();
                player.seekTo((this.value / 100) * d);
            };
            
            el.watchLike.onclick = toggleLike;
            
            el.miniExpand.onclick = () => showPage('watch');
            
            // Giữ phát ngầm trên CarPlay
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden && isPlaying && player) {
                    player.playVideo();
                }
            });
        }

        // ==================== KHỞI TẠO ====================
        loadAPI();
        setupEvents();
    </script>
</body>
</html>
