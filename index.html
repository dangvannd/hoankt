<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="MusicPlay">
    <meta name="format-detection" content="telephone=no">
    <title>MusicPlay - Nghe Nhạc</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        dark: '#0F0F0F',
                        darkGray: '#272727',
                        hoverGray: '#3F3F3F',
                        red: '#FF0000',
                        lightText: '#F1F1F1',
                        grayText: '#AAAAAA'
                    },
                    fontFamily: { sans: ['Roboto', 'Arial', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { height: 100%; overflow: hidden; margin: 0; }
        input, textarea { font-size: 16px !important; }
        .progress-bar { 
            -webkit-appearance: none; appearance: none; height: 6px; border-radius: 3px; 
            background: #444; cursor: pointer; width: 100%; 
        }
        .progress-bar::-webkit-slider-thumb { 
            -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; 
            background: #fff; cursor: pointer; 
        }
        .player-wrapper {
            position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 12px;
            overflow: hidden; background: #1a1a1a;
        }
        #youtube-player { width: 100%; height: 100%; border: none; display: block; }
        .player-loading {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #1a1a1a; z-index: 10;
            transition: opacity 0.3s ease;
        }
        .player-loading.hidden { opacity: 0; pointer-events: none; }
        .card-hover:hover { transform: scale(1.03); transition: transform 0.2s ease; }
        .suggest-item:hover { background-color: rgba(255,255,255,0.08); }
        .suggest-item.active { background-color: rgba(255,0,0,0.15); }
        .btn-large { min-height: 44px; min-width: 44px; }
        .hide-scrollbar::-webkit-scrollbar { width: 4px; }
        .hide-scrollbar::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
        .error-text { color: #ff6b6b; font-size: 14px; margin-top: 8px; }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-dark text-lightText font-sans antialiased h-screen flex flex-col">
    <!-- Header -->
    <header class="shrink-0 bg-dark z-50 px-4 py-3 flex items-center justify-between border-b border-gray-800/50">
        <div class="flex items-center gap-3">
            <a href="#" id="logoLink" class="flex items-center gap-2">
                <div class="bg-red rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fa fa-play text-white text-xs ml-0.5"></i>
                </div>
                <span class="font-bold text-xl">MusicPlay</span>
            </a>
        </div>

        <div class="flex-1 max-w-[640px] mx-4 relative">
            <div class="relative flex">
                <input type="text" id="searchInput" placeholder="Tìm bài hát..." 
                    class="w-full px-5 py-2.5 bg-darkGray border border-gray-700 rounded-l-full focus:outline-none focus:border-red text-base"
                    autocomplete="off">
                <button id="searchBtn" class="px-6 bg-hoverGray border border-l-0 border-gray-700 rounded-r-full hover:bg-gray-600 transition btn-large">
                    <i class="fa fa-search text-lg"></i>
                </button>
            </div>
        </div>

        <div class="w-9 h-9 rounded-full bg-red flex items-center justify-center cursor-pointer">
            <span class="font-bold">U</span>
        </div>
    </header>

    <!-- Nội dung chính -->
    <div class="flex flex-1 overflow-hidden">
        <!-- Trang chủ -->
        <main id="mainContent" class="flex-1 overflow-y-auto hide-scrollbar p-4">
            <section id="homePage">
                <h2 class="text-xl font-bold mb-2">🎵 Gợi ý nghe nhạc</h2>
                <p class="text-grayText text-sm mb-4">Nhấn bài hát → nhấn nút Phát nếu không tự chạy</p>
                <div id="videoGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <div class="col-span-full text-center py-12 text-grayText">
                        <i class="fa fa-spinner fa-spin fa-2x text-red mb-3"></i>
                        <p>Đang tải gợi ý...</p>
                    </div>
                </div>
            </section>

            <!-- Trang phát nhạc -->
            <section id="watchPage" class="hidden">
                <div class="flex flex-col lg:flex-row gap-5 h-full">
                    <!-- Cột trái: Trình phát -->
                    <div class="flex-1 flex flex-col min-w-0">
                        <div class="player-wrapper mb-4 relative">
                            <div id="playerLoading" class="player-loading">
                                <i class="fa fa-spinner fa-spin fa-3x text-red mb-3"></i>
                                <p id="loadingText">Đang tải trình phát...</p>
                                <button id="manualPlayBtn" class="hidden mt-4 px-6 py-3 bg-red rounded-full text-white font-bold hover:bg-red/90 transition btn-large">
                                    <i class="fa fa-play mr-2"></i> Nhấn để phát ngay
                                </button>
                                <p id="errorMsg" class="error-text hidden"></p>
                            </div>
                            <iframe id="youtube-player" frameborder="0" allowfullscreen 
                                allow="autoplay; encrypted-media; picture-in-picture; fullscreen">
                            </iframe>
                        </div>
                        
                        <h1 id="watchTitle" class="text-xl font-bold mb-2 line-clamp-2">Tên bài hát</h1>
                        <p id="watchChannel" class="text-grayText mb-4">Tên kênh</p>
                        
                        <div class="mb-4">
                            <input type="range" id="watchProgress" class="progress-bar" min="0" max="100" value="0">
                            <div class="flex justify-between text-sm text-grayText mt-1">
                                <span id="watchCurrent">0:00</span>
                                <span id="watchTotal">0:00</span>
                            </div>
                        </div>
                        
                        <div class="flex items-center justify-center gap-4 mb-6">
                            <button id="watchShuffle" class="text-grayText hover:text-white transition btn-large p-2">
                                <i class="fa fa-random fa-lg"></i>
                            </button>
                            <button id="watchPrev" class="text-lightText hover:text-white transition text-xl btn-large p-2">
                                <i class="fa fa-step-backward"></i>
                            </button>
                            <button id="watchPlayPause" class="w-14 h-14 bg-red rounded-full flex items-center justify-center text-white hover:bg-red/90 transition shadow-lg btn-large">
                                <i class="fa fa-play ml-1 text-xl"></i>
                            </button>
                            <button id="watchNext" class="text-lightText hover:text-white transition text-xl btn-large p-2">
                                <i class="fa fa-step-forward"></i>
                            </button>
                            <button id="watchRepeat" class="text-grayText hover:text-white transition btn-large p-2">
                                <i class="fa fa-repeat fa-lg"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- Cột phải: Gợi ý -->
                    <div class="w-full lg:w-[360px] shrink-0 flex flex-col">
                        <h3 class="font-bold mb-3">🎶 Gợi ý cho bạn</h3>
                        <div id="suggestedList" class="space-y-3 flex-1 overflow-y-auto hide-scrollbar pr-2">
                            <p class="text-grayText text-sm py-4 text-center">Đang tải gợi ý...</p>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // ==================== CẤU HÌNH ====================
        // ⚠️ Kiểm tra khóa API bên dưới có đúng không!
        const YOUTUBE_API_KEY = "AIzaSyCPZf8Kws-Czw-6AIoZebDO_XTeCSZ2ni0";
        const API_SEARCH = "https://www.googleapis.com/youtube/v3/search";

        // ==================== DANH SÁCH GỢI Ý ====================
        const SUGGESTED_KEYWORDS = [
            "nhạc vàng bolero hay nhất",
            "liên khúc bolero trữ tình",
            "nhạc nhẹ thư giãn",
            "nhạc ballad Việt Nam"
        ];

        // ==================== TRẠNG THÁI ====================
        let player = null;
        let isAPILoaded = false;
        let isPlayerReady = false;
        let playlist = [];
        let currentIdx = -1;
        let isShuffle = false;
        let repeatMode = 0;
        let isPlaying = false;
        let pendingVideoToPlay = null;
        let timeUpdateInterval = null;

        // ==================== PHẦN TỬ ====================
        const el = {
            searchInput: document.getElementById('searchInput'),
            searchBtn: document.getElementById('searchBtn'),
            videoGrid: document.getElementById('videoGrid'),
            homePage: document.getElementById('homePage'),
            watchPage: document.getElementById('watchPage'),
            playerLoading: document.getElementById('playerLoading'),
            loadingText: document.getElementById('loadingText'),
            manualPlayBtn: document.getElementById('manualPlayBtn'),
            errorMsg: document.getElementById('errorMsg'),
            youtubePlayer: document.getElementById('youtube-player'),
            watchTitle: document.getElementById('watchTitle'),
            watchChannel: document.getElementById('watchChannel'),
            watchProgress: document.getElementById('watchProgress'),
            watchCurrent: document.getElementById('watchCurrent'),
            watchTotal: document.getElementById('watchTotal'),
            watchPlayPause: document.getElementById('watchPlayPause'),
            watchNext: document.getElementById('watchNext'),
            watchPrev: document.getElementById('watchPrev'),
            watchShuffle: document.getElementById('watchShuffle'),
            watchRepeat: document.getElementById('watchRepeat'),
            suggestedList: document.getElementById('suggestedList'),
            logoLink: document.getElementById('logoLink')
        };

        // ==================== TẢI API SỚM ====================
        function loadAPI() {
            console.log('📌 Đang tải YouTube API...');
            const s = document.createElement('script');
            s.src = "https://www.youtube.com/iframe_api";
            s.async = true;
            s.onload = () => console.log('✅ API script đã tải');
            s.onerror = () => showError('Không tải được YouTube API');
            document.head.appendChild(s);
        }

        window.onYouTubeIframeAPIReady = function() {
            console.log('✅ YouTube API đã sẵn sàng');
            isAPILoaded = true;
            initPlayer();
        };

        // ==================== KHỞI TẠO TRÌNH PHÁT ====================
        function initPlayer() {
            if (!window.YT || !window.YT.Player) {
                console.log('⏳ Chờ API...');
                setTimeout(initPlayer, 200);
                return;
            }

            console.log('📌 Khởi tạo trình phát...');
            player = new YT.Player('youtube-player', {
                height: '100%',
                width: '100%',
                playerVars: { 
                    autoplay: 0, // ⚠️ Đặt 0 để tránh chặn tự động phát
                    controls: 1,
                    enablejsapi: 1,
                    origin: location.origin,
                    rel: 0,
                    modestbranding: 1,
                    playsinline: 1
                },
                events: {
                    onReady: onPlayerReady,
                    onStateChange: onStateChange,
                    onError: onPlayerError
                }
            });
        }

        function onPlayerReady(e) {
            console.log('✅ Trình phát sẵn sàng');
            isPlayerReady = true;
            e.target.setVolume(75);
            el.playerLoading.classList.add('hidden');
            
            // Nếu có bài đang chờ → phát ngay
            if (pendingVideoToPlay) {
                actuallyPlayVideo(pendingVideoToPlay);
                pendingVideoToPlay = null;
            }
        }

        function onStateChange(e) {
            console.log('📌 Trạng thái phát:', e.data);
            switch (e.data) {
                case YT.PlayerState.PLAYING:
                    isPlaying = true;
                    el.playerLoading.classList.add('hidden');
                    el.manualPlayBtn.classList.add('hidden');
                    el.errorMsg.classList.add('hidden');
                    updatePlayButton();
                    startTimeUpdate();
                    break;
                case YT.PlayerState.PAUSED:
                    isPlaying = false;
                    updatePlayButton();
                    stopTimeUpdate();
                    break;
                case YT.PlayerState.ENDED:
                    stopTimeUpdate();
                    repeatMode === 2 ? player.seekTo(0) : playNext();
                    break;
                case YT.PlayerState.BUFFERING:
                    el.loadingText.textContent = 'Đang đệm dữ liệu...';
                    el.playerLoading.classList.remove('hidden');
                    break;
                case YT.PlayerState.CUED:
                    el.loadingText.textContent = 'Sẵn sàng phát';
                    el.playerLoading.classList.remove('hidden');
                    el.manualPlayBtn.classList.remove('hidden');
                    break;
            }
        }

        function onPlayerError(e) {
            console.error('❌ Lỗi trình phát:', e.data);
            let msg = 'Lỗi không xác định';
            switch(e.data) {
                case 2: msg = 'ID video không hợp lệ'; break;
                case 100: msg = 'Video không tồn tại hoặc bị xóa'; break;
                case 101: case 150: msg = 'Chủ sở hữu không cho phép nhúng video'; break;
            }
            showError(msg);
            setTimeout(playNext, 3000);
        }

        function showError(msg) {
            el.errorMsg.textContent = msg;
            el.errorMsg.classList.remove('hidden');
            el.loadingText.textContent = 'Có lẽ xảy ra';
        }

        // ==================== PHÁT BÀI HÁT ====================
        function playVideo(v) {
            console.log('▶️ Chọn bài:', v.title);
            
            // Thêm vào danh sách
            if (!playlist.some(x => x.id === v.id)) {
                playlist.push(v);
            }
            currentIdx = playlist.findIndex(x => x.id === v.id);
            
            // Cập nhật giao diện ngay
            el.watchTitle.textContent = v.title;
            el.watchChannel.textContent = v.channel;
            showPage('watch');
            
            // Reset trạng thái
            el.playerLoading.classList.remove('hidden');
            el.loadingText.textContent = 'Đang chuẩn bị phát...';
            el.manualPlayBtn.classList.add('hidden');
            el.errorMsg.classList.add('hidden');
            
            // Kiểm tra đã sẵn sàng chưa
            if (isPlayerReady && player && player.loadVideoById) {
                actuallyPlayVideo(v.id);
            } else {
                // Chờ trình phát khởi tạo xong
                pendingVideoToPlay = v.id;
                el.loadingText.textContent = 'Đang khởi tạo trình phát...';
            }
            
            // Tải gợi ý
            loadSideSuggestions(v.title);
        }

        function actuallyPlayVideo(videoId) {
            console.log('▶️ Tải video ID:', videoId);
            player.loadVideoById({ 
                videoId: videoId,
                suggestedQuality: 'medium'
            });
            // Yêu cầu phát sau khi tải
            setTimeout(() => {
                if (player && player.playVideo) {
                    player.playVideo();
                }
            }, 300);
        }

        // Nút phát thủ công khi trình duyệt chặn tự động
        el.manualPlayBtn.addEventListener('click', () => {
            if (player && player.playVideo) {
                player.playVideo();
            }
        });

        function playNext() {
            if (!playlist.length) return;
            let next;
            if (isShuffle) {
                do { next = Math.floor(Math.random() * playlist.length); }
                while (next === currentIdx && playlist.length > 1);
            } else {
                next = currentIdx + 1;
                if (next >= playlist.length) next = repeatMode === 1 ? 0 : currentIdx;
            }
            playVideo(playlist[next]);
        }

        function playPrev() {
            if (!isPlayerReady || currentIdx < 0) return;
            player.getCurrentTime().then(t => {
                if (t > 3) player.seekTo(0);
                else playVideo(playlist[currentIdx > 0 ? currentIdx - 1 : playlist.length - 1]);
            });
        }

        function togglePlay() {
            if (!isPlayerReady || !player) return;
            isPlaying ? player.pauseVideo() : player.playVideo();
        }

        function updatePlayButton() {
            el.watchPlayPause.innerHTML = `<i class="fa fa-${isPlaying ? 'pause' : 'play'} ml-1 text-xl"></i>`;
        }

        function startTimeUpdate() {
            stopTimeUpdate();
            timeUpdateInterval = setInterval(() => {
                if (!isPlayerReady || !player.getDuration) return;
                const t = player.getCurrentTime(), d = player.getDuration();
                if (d) {
                    el.watchProgress.value = (t / d) * 100;
                    el.watchCurrent.textContent = fmtTime(t);
                    el.watchTotal.textContent = fmtTime(d);
                }
            }, 500);
        }

        function stopTimeUpdate() {
            if (timeUpdateInterval) {
                clearInterval(timeUpdateInterval);
                timeUpdateInterval = null;
            }
        }

        // ==================== TÌM KIẾM & GỢI Ý ====================
        async function searchDirect(q, isSuggestion = false) {
            if (!q || !q.trim()) return [];
            
            try {
                const res = await fetch(`${API_SEARCH}?part=snippet&q=${encodeURIComponent(q)}&type=video&videoCategoryId=10&maxResults=12&key=${YOUTUBE_API_KEY}`);
                if (!res.ok) throw new Error(`Lỗi ${res.status}`);
                const data = await res.json();
                
                // Kiểm tra quota
                if (data.error) {
                    console.error('API Error:', data.error);
                    if (!isSuggestion) alert('Lỗi API: ' + data.error.message);
                    return [];
                }
                
                if (!data.items) return [];
                
                return data.items.map(item => ({
                    id: item.id.videoId,
                    title: item.snippet.title.replace(/&quot;/g, '"').replace(/&amp;/g, '&'),
                    channel: item.snippet.channelTitle,
                    thumb: item.snippet.thumbnails.high.url
                }));
            } catch (err) {
                console.error('Lỗi tìm kiếm:', err);
                if (!isSuggestion) alert('Không tìm được: ' + err.message);
                return [];
            }
        }

        async function loadSuggestions() {
            const randomKeyword = SUGGESTED_KEYWORDS[Math.floor(Math.random() * SUGGESTED_KEYWORDS.length)];
            const results = await searchDirect(randomKeyword, true);
            
            if (results.length) {
                renderHomePage(results);
            } else {
                el.videoGrid.innerHTML = `
                    <div class="col-span-full text-center py-8 text-red-400">
                        <p class="mb-2">⚠️ Không tải được gợi ý</p>
                        <p class="text-sm text-grayText">Kiểm tra khóa API YouTube của bạn</p>
                        <button onclick="loadSuggestions()" class="mt-4 px-4 py-2 bg-red rounded-full hover:bg-red/90">
                            <i class="fa fa-refresh mr-2"></i> Tải lại
                        </button>
                    </div>
                `;
            }
        }

        async function loadSideSuggestions(title) {
            const q = title.split(' - ')[0].substring(0, 30);
            const results = await searchDirect(q + ' nhạc', true);
            const filtered = results.filter(v => !playlist.length || v.id !== playlist[currentIdx]?.id).slice(0, 8);
            renderSuggestedList(filtered);
        }

        function renderHomePage(list) {
            el.videoGrid.innerHTML = '';
            list.forEach(v => {
                const card = document.createElement('div');
                card.className = 'cursor-pointer card-hover';
                card.innerHTML = `
                    <div class="rounded-xl overflow-hidden bg-gray-800 aspect-video mb-2">
                        <img src="${v.thumb}" alt="${v.title}" loading="eager" class="w-full h-full object-cover">
                    </div>
                    <h3 class="font-medium line-clamp-2">${v.title}</h3>
                    <p class="text-sm text-grayText mt-1">${v.channel}</p>
                `;
                card.onclick = () => playVideo(v);
                el.videoGrid.appendChild(card);
            });
        }

        function renderSuggestedList(list) {
            if (!list.length) {
                el.suggestedList.innerHTML = `<p class="text-grayText text-sm py-4 text-center">Không có gợi ý</p>`;
                return;
            }
            el.suggestedList.innerHTML = '';
            list.forEach(v => {
                const isActive = playlist[currentIdx]?.id === v.id;
                const item = document.createElement('div');
                item.className = `suggest-item flex items-center gap-3 p-2 rounded-lg cursor-pointer ${isActive ? 'active' : ''}`;
                item.innerHTML = `
                    <img src="${v.thumb}" alt="" class="w-24 h-14 rounded object-cover shrink-0">
                    <div class="flex-1 min-w-0">
                        <h4 class="text-sm font-medium line-clamp-2 ${isActive ? 'text-red' : ''}">${v.title}</h4>
                        <p class="text-xs text-grayText mt-1">${v.channel}</p>
                    </div>
                `;
                item.onclick = () => playVideo(v);
                el.suggestedList.appendChild(item);
            });
        }

        function showPage(page) {
            el.homePage.classList.toggle('hidden', page !== 'home');
            el.watchPage.classList.toggle('hidden', page !== 'watch');
        }

        function fmtTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s/60), ss = Math.floor(s%60);
            return `${m}:${ss.toString().padStart(2,'0')}`;
        }

        // ==================== SỰ KIỆN ====================
        el.searchInput.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const q = el.searchInput.value.trim();
                if (q) searchDirect(q).then(results => {
                    if (results.length) renderHomePage(results);
                });
            }
        });
        el.searchBtn.addEventListener('click', () => {
            const q = el.searchInput.value.trim();
            if (q) searchDirect(q).then(results => {
                if (results.length) renderHomePage(results);
            });
        });
        el.logoLink.addEventListener('click', e => {
            e.preventDefault();
            showPage('home');
        });
        el.watchPlayPause.addEventListener('click', togglePlay);
        el.watchNext.addEventListener('click', playNext);
        el.watchPrev.addEventListener('click', playPrev);
        el.watchShuffle.addEventListener('click', () => {
            isShuffle = !isShuffle;
            el.watchShuffle.classList.toggle('text-red', isShuffle);
            el.watchShuffle.classList.toggle('text-grayText', !isShuffle);
        });
        el.watchRepeat.addEventListener('click', () => {
            repeatMode = (repeatMode + 1) % 3;
            el.watchRepeat.classList.toggle('text-red', repeatMode > 0);
            el.watchRepeat.classList.toggle('text-grayText', repeatMode === 0);
        });
        el.watchProgress.addEventListener('input', function() {
            if (!isPlayerReady || !player) return;
            player.seekTo((this.value / 100) * player.getDuration());
        });

        // Giữ phát khi chuyển tab/ứng dụng
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden && isPlaying && isPlayerReady && player) {
                player.playVideo();
            }
        });

        // ==================== KHỞI TẠO ====================
        loadAPI();
        loadSuggestions();
    </script>
</body>
</html>
